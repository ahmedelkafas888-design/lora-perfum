<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maison De Parfum - Admin Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Marcellus&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Marcellus', serif; background-color: #faf8f5; }
        .luxury-font { font-family: 'Cinzel', serif; }
    </style>
</head>
<body class="text-neutral-900">

    <header class="bg-black text-white py-6 px-8 flex justify-between items-center shadow-md">
        <div>
            <h1 class="luxury-font text-xl tracking-widest text-amber-400">MAISON DE PARFUM</h1>
            <p class="text-[10px] uppercase tracking-wider text-neutral-400">Master Enterprise Control Interface</p>
        </div>
        <a href="/" class="text-xs uppercase bg-neutral-900 border border-amber-500/40 text-amber-300 px-4 py-2 hover:bg-amber-500 hover:text-black transition duration-300">Exit Workspace</a>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <section class="space-y-6 lg:col-span-1">
            <div class="bg-white p-6 border border-neutral-200/80 shadow-sm rounded-none">
                <h2 class="luxury-font text-base text-amber-900 border-b border-neutral-100 pb-3 mb-4 uppercase tracking-wider font-semibold">Store Settings</h2>
                <form id="globalStoreSettingsConfigForm" class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-semibold uppercase tracking-wider text-neutral-500 mb-1">Persistent WhatsApp Route Target</label>
                        <input type="text" id="settingWhatsappNumber" placeholder="+201000000000" class="w-full bg-neutral-50 border border-neutral-200 p-2 text-xs focus:outline-none focus:border-amber-600">
                        <span class="text-[10px] text-neutral-400 mt-1 block">Must contain precise country calling index prefixes.</span>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold uppercase tracking-wider text-neutral-500 mb-1">Promo Text (English)</label>
                        <input type="text" id="settingPromoTextEn" class="w-full bg-neutral-50 border border-neutral-200 p-2 text-xs focus:outline-none focus:border-amber-600">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold uppercase tracking-wider text-neutral-500 mb-1">Promo Text (Arabic)</label>
                        <input type="text" id="settingPromoTextAr" dir="rtl" class="w-full bg-neutral-50 border border-neutral-200 p-2 text-xs focus:outline-none focus:border-amber-600">
                    </div>
                    <button type="submit" class="w-full bg-amber-800 text-white py-2 text-xs uppercase tracking-widest font-medium hover:bg-black transition duration-300">Commit Global Configurations</button>
                </form>
            </div>

            <div class="bg-white p-6 border border-neutral-200/80 shadow-sm rounded-none">
                <h2 id="formWorkspaceStateHeaderTitle" class="luxury-font text-base text-amber-900 border-b border-neutral-100 pb-3 mb-4 uppercase tracking-wider font-semibold">Deploy New Perfume</h2>
                <form id="productMutationActionForm" class="space-y-4">
                    <input type="hidden" id="fieldPerfumeIdTarget" value="">
                    
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] font-semibold text-neutral-500 uppercase mb-1">Name (EN)</label>
                            <input type="text" id="fieldPerfumeNameEn" required class="w-full bg-neutral-50 border border-neutral-200 p-2 text-xs focus:outline-none focus:border-amber-600">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-neutral-500 uppercase mb-1">Name (AR)</label>
                            <input type="text" id="fieldPerfumeNameAr" dir="rtl" required class="w-full bg-neutral-50 border border-neutral-200 p-2 text-xs focus:outline-none focus:border-amber-600">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] font-semibold text-neutral-500 uppercase mb-1">Category Allocation</label>
                            <select id="fieldPerfumeCategory" required class="w-full bg-neutral-50 border border-neutral-200 p-2 text-xs focus:outline-none focus:border-amber-600">
                                <option value="men">Men</option>
                                <option value="women">Women</option>
                                <option value="unisex">Unisex</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-neutral-500 uppercase mb-1">Vault Inventory Stock</label>
                            <input type="number" id="fieldPerfumeStock" min="0" default="10" required class="w-full bg-neutral-50 border border-neutral-200 p-2 text-xs focus:outline-none focus:border-amber-600">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-semibold text-neutral-500 uppercase mb-1">Image Asset Asset URL</label>
                        <input type="url" id="fieldPerfumeImageUrl" required class="w-full bg-neutral-50 border border-neutral-200 p-2 text-xs focus:outline-none focus:border-amber-600">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-[11px] font-semibold text-neutral-500 uppercase mb-1">Description (EN)</label>
                            <textarea id="fieldPerfumeDescEn" rows="2" required class="w-full bg-neutral-50 border border-neutral-200 p-2 text-xs focus:outline-none focus:border-amber-600"></textarea>
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-neutral-500 uppercase mb-1">Description (AR)</label>
                            <textarea id="fieldPerfumeDescAr" rows="2" dir="rtl" required class="w-full bg-neutral-50 border border-neutral-200 p-2 text-xs focus:outline-none focus:border-amber-600"></textarea>
                        </div>
                    </div>

                    <div class="border-t border-neutral-100 pt-3">
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-amber-900">Custom Size Sizing Matrix Matrix</label>
                            <button type="button" onclick="appendSizeMatrixConfigRow()" class="text-[10px] bg-neutral-900 text-white px-2 py-1 uppercase tracking-wider hover:bg-amber-700 transition">Add Sizing Matrix Configuration Slot</button>
                        </div>
                        <div id="dynamicSizingMatrixInputTargetWrapper" class="space-y-2">
                            </div>
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button type="submit" class="flex-grow bg-black text-white py-2.5 text-xs uppercase tracking-widest font-medium hover:bg-amber-800 transition duration-300">Save Product Data Matrix</button>
                        <button type="button" id="btnCancelWorkspaceEditingState" onclick="resetWorkspaceFormState()" class="hidden bg-neutral-200 text-neutral-700 px-4 text-xs uppercase tracking-wider hover:bg-neutral-300">Cancel</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="lg:col-span-2">
            <div class="bg-white p-6 border border-neutral-200/80 shadow-sm rounded-none h-full">
                <h2 class="luxury-font text-base text-neutral-900 border-b border-neutral-100 pb-3 mb-6 uppercase tracking-wider font-semibold">Active Vault Fragrance Manifest Inventory</h2>
                <div id="adminLiveProductInventoryRosterGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    </div>
            </div>
        </section>
    </main>

    <script>
        let runtimeCacheManifest = [];

        document.addEventListener('DOMContentLoaded', () => {
            fetchSystemSettingsParameters();
            fetchSystemInventoryProducts();
            document.getElementById('globalStoreSettingsConfigForm').addEventListener('submit', persistStoreWideSettings);
            document.getElementById('productMutationActionForm').addEventListener('submit', persistProductMutationAction);
        });

        async function fetchSystemSettingsParameters() {
            try {
                const res = await fetch('/api/settings');
                const data = await res.json();
                document.getElementById('settingWhatsappNumber').value = data.whatsappNumber || '';
                document.getElementById('settingPromoTextEn').value = data.promoTextEn || '';
                document.getElementById('settingPromoTextAr').value = data.promoTextAr || '';
            } catch (err) { console.error("Settings system capture extraction failure:", err); }
        }

        async function persistStoreWideSettings(e) {
            e.preventDefault();
            const payload = {
                whatsappNumber: document.getElementById('settingWhatsappNumber').value.trim(),
                promoTextEn: document.getElementById('settingPromoTextEn').value.trim(),
                promoTextAr: document.getElementById('settingPromoTextAr').value.trim()
            };

            try {
                const res = await fetch('/api/settings', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) alert("System operations configurations saved permanently to the DB layer.");
                else { const errData = await res.json(); alert(`Error: ${errData.error}`); }
            } catch (err) { alert("Persistence channel failure."); }
        }

        async function fetchSystemInventoryProducts() {
            try {
                const res = await fetch('/api/perfumes');
                runtimeCacheManifest = await res.json();
                renderAdministrativeInventoryGrid();
            } catch (err) { console.error("Database connection validation extraction dropped:", err); }
        }

        function appendSizeMatrixConfigRow(sizeStr = '', priceVal = '') {
            const wrapper = document.getElementById('dynamicSizingMatrixInputTargetWrapper');
            const targetRowUid = 'row_uid_' + Math.random().toString(36).substring(2, 9);
            
            const element = document.createElement('div');
            element.id = targetRowUid;
            element.className = "flex items-center gap-2 bg-neutral-50 p-2 border border-neutral-200";
            element.innerHTML = `
                <input type="text" placeholder="e.g. 100ml" value="${sizeStr}" required class="w-1/2 bg-white border border-neutral-300 p-1 text-xs focus:outline-none sizing-matrix-label-input">
                <input type="number" step="any" placeholder="Price $" value="${priceVal}" required class="w-1/2 bg-white border border-neutral-300 p-1 text-xs focus:outline-none sizing-matrix-value-input">
                <button type="button" onclick="dropSizeMatrixConfigRow('${targetRowUid}')" class="text-red-600 hover:text-red-900 text-xs font-bold px-1">✕</button>
            `;
            wrapper.appendChild(element);
        }

        function dropSizeMatrixConfigRow(uid) {
            const element = document.getElementById(uid);
            if(element) element.remove();
        }

        function renderAdministrativeInventoryGrid() {
            const grid = document.getElementById('adminLiveProductInventoryRosterGrid');
            grid.innerHTML = '';

            if (runtimeCacheManifest.length === 0) {
                grid.innerHTML = '<p class="text-neutral-400 text-xs uppercase p-4 col-span-full text-center">Warehouse active catalog manifest state is empty.</p>';
                return;
            }

            runtimeCacheManifest.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-neutral-50 p-4 border border-neutral-200/70 flex gap-4 items-start";
                card.innerHTML = `
                    <img src="${p.imageUrl}" class="w-16 h-16 object-cover border border-neutral-300 bg-white">
                    <div class="flex-grow">
                        <h4 class="text-xs font-bold text-neutral-900">${p.nameEn} <span class="text-neutral-400 font-normal">(${p.nameAr})</span></h4>
                        <p class="text-[10px] text-neutral-500 uppercase mt-0.5">Category: ${p.category} | Stock: ${p.stock}</p>
                        <div class="mt-2 space-y-0.5">
                            ${p.sizes.map(s => `<span class="inline-block bg-neutral-200 text-neutral-800 text-[9px] px-1.5 py-0.5 rounded-none mr-1 font-semibold">${s.size}: $${s.price}</span>`).join('')}
                        </div>
                        <div class="mt-3 flex gap-2 border-t border-neutral-200/60 pt-2">
                            <button onclick="triggerWorkspaceContextEditMode('${p._id}')" class="text-[10px] uppercase font-bold text-amber-700 hover:text-amber-900">Modify</button>
                            <button onclick="executeAbsoluteDatabasePurge('${p._id}')" class="text-[10px] uppercase font-bold text-red-600 hover:text-red-900">Purge</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function triggerWorkspaceContextEditMode(id) {
            const p = runtimeCacheManifest.find(item => item._id === id);
            if (!p) return;

            document.getElementById('formWorkspaceStateHeaderTitle').innerText = "Modify Existing Scent Profile";
            document.getElementById('fieldPerfumeIdTarget').value = p._id;
            document.getElementById('fieldPerfumeNameEn').value = p.nameEn;
            document.getElementById('fieldPerfumeNameAr').value = p.nameAr;
            document.getElementById('fieldPerfumeCategory').value = p.category;
            document.getElementById('fieldPerfumeStock').value = p.stock;
            document.getElementById('fieldPerfumeImageUrl').value = p.imageUrl;
            document.getElementById('fieldPerfumeDescEn').value = p.descriptionEn;
            document.getElementById('fieldPerfumeDescAr').value = p.descriptionAr;

            const wrapper = document.getElementById('dynamicSizingMatrixInputTargetWrapper');
            wrapper.innerHTML = '';
            p.sizes.forEach(s => appendSizeMatrixConfigRow(s.size, s.price));

            document.getElementById('btnCancelWorkspaceEditingState').classList.remove('hidden');
        }

        function resetWorkspaceFormState() {
            document.getElementById('formWorkspaceStateHeaderTitle').innerText = "Deploy New Perfume";
            document.getElementById('fieldPerfumeIdTarget').value = '';
            document.getElementById('productMutationActionForm').reset();
            document.getElementById('dynamicSizingMatrixInputTargetWrapper').innerHTML = '';
            document.getElementById('btnCancelWorkspaceEditingState').classList.add('hidden');
            appendSizeMatrixConfigRow('100ml', '50'); // Balanced deployment sample baseline
        }

        async function persistProductMutationAction(e) {
            e.preventDefault();
            const id = document.getElementById('fieldPerfumeIdTarget').value;
            
            // Extract custom allocated container matrices from UI dynamic rows safely
            const sizeRows = document.getElementById('dynamicSizingMatrixInputTargetWrapper').children;
            const sizesPayload = [];
            for (let row of sizeRows) {
                const label = row.querySelector('.sizing-matrix-label-input').value.trim();
                const price = parseFloat(row.querySelector('.sizing-matrix-value-input').value);
                if (label && !isNaN(price)) {
                    sizesPayload.push({ size: label, price: price });
                }
            }

            if(sizesPayload.length === 0) {
                alert("Minimum allocation boundaries specify at least one distinct structural custom sizing size and pricing configuration configuration parameter.");
                return;
            }

            const payload = {
                nameEn: document.getElementById('fieldPerfumeNameEn').value.trim(),
                nameAr: document.getElementById('fieldPerfumeNameAr').value.trim(),
                category: document.getElementById('fieldPerfumeCategory').value,
                stock: parseInt(document.getElementById('fieldPerfumeStock').value) || 0,
                imageUrl: document.getElementById('fieldPerfumeImageUrl').value.trim(),
                descriptionEn: document.getElementById('fieldPerfumeDescEn').value.trim(),
                descriptionAr: document.getElementById('fieldPerfumeDescAr').value.trim(),
                sizes: sizesPayload
            };

            const url = id ? `/api/perfumes/${id}` : '/api/perfumes';
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert("Product changes synchronized to data persistence engine securely.");
                    resetWorkspaceFormState();
                    fetchSystemInventoryProducts();
                } else {
                    const err = await res.json();
                    alert(`Operational Error Rejection Execution: ${err.error}`);
                }
            } catch (err) { alert("Communication route break encountered during synchronization."); }
        }

        async function executeAbsoluteDatabasePurge(id) {
            if(!confirm("Are you sure you want to permanently delete this product? This action cannot be undone.")) return;
            try {
                const res = await fetch(`/api/perfumes/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    alert("Record purged successfully.");
                    fetchSystemInventoryProducts();
                    if(document.getElementById('fieldPerfumeIdTarget').value === id) resetWorkspaceFormState();
                }
            } catch (err) { alert("Purge orchestration pipeline intercept error."); }
        }
    </script>
</body>
</html>
