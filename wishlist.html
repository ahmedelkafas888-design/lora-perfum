<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist - LORA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container"><a href="index.html" class="brand-logo">LORA</a></div>
    </nav>
    <main class="container">
        <h1 class="luxury-title">MY WISHLIST</h1>
        <div class="product-grid" id="wishlistGrid"></div>
    </main>
    <script type="module">
        let wishlist = JSON.parse(localStorage.getItem('lora_wishlist') || '[]');
        const container = document.getElementById('wishlistGrid');
        if(wishlist.length === 0) {
            container.innerHTML = `<p style="text-align:center; grid-column: 1/-1; color:var(--gray-muted);">Your custom wishlist dashboard profile is currently empty.</p>`;
        } else {
            container.innerHTML = wishlist.map(p => `
                <div class="product-card">
                    <div class="card-img-wrapper"><img src="${p.imageUrl}" class="card-img"></div>
                    <div class="card-info">
                        <div class="product-title">${p.title}</div>
                        <div class="current-price">${p.price} AED</div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
