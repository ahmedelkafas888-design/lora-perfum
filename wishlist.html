<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist - LORA</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container"><a href="index.html" class="brand-logo">LORA</a></div>
    </nav>
    <main class="container">
        <h1 class="luxury-title">YOUR WISHLIST</h1>
        <p class="luxury-subtitle">Saved Premium Fragrances</p>
        <div class="product-grid" id="wishlistDisplayGrid"></div>
    </main>

    <script type="module">
        import { generateProductCardsMarkup } from './script.js';
        function drawWishlist() {
            const list = JSON.parse(localStorage.getItem('lora_wishlist') || '[]');
            const grid = document.getElementById('wishlistDisplayGrid');
            if(list.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:var(--gray-muted);">Your custom wishlist is currently empty.</p>`;
                return;
            }
            grid.innerHTML = generateProductCardsMarkup(list);
        }
        document.addEventListener('DOMContentLoaded', drawWishlist);
    </script>
</body>
</html>
