<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desires Manifest | Maison De Parfum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="store-container nav-wrapper">
            <button id="langSwitcherBtn" class="text-xs tracking-widest uppercase font-bold text-amber-500">العربية</button>
            <a href="index.html" class="text-2xl tracking-[0.2em] font-light luxury-heading gold-gradient-text">MAISON DE PARFUM</a>
            <nav class="hidden md:flex gap-8">
                <ul class="nav-links">
                    <li><a href="index.html" data-i18n="navHome">Home</a></li>
                    <li><a href="products.html" data-i18n="navProducts">Fragrances</a></li>
                    <li><a href="wishlist.html" data-i18n="navWishlist">Wishlist</a></li>
                    <li><a href="admin.html" data-i18n="navAdmin">Atelier Panel</a></li>
                </ul>
            </nav>
            <div class="nav-icons">
                <a href="wishlist.html" class="icon-btn"><span>♥</span><span id="wishlistCountBadge" class="badge">0</span></a>
                <a href="cart.html" class="icon-btn"><span>🛒</span><span id="cartCountBadge" class="badge">0</span></a>
            </div>
        </div>
    </header>

    <main class="pt-[140px] store-container pb-24">
        <h1 class="text-3xl font-light tracking-widest text-center mb-16 uppercase gold-gradient-text" data-i18n="navWishlist">Wishlist</h1>
        <div id="wishlistDisplayGridTarget" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </main>

    <script type="module" src="firebase.js"></script>
    <script type="module" src="script.js"></script>
    <script type="module">
        import { dbEngine } from "./firebase.js";
        import { StoreApp } from "./script.js";
        import { CartEngine } from "./cart.js";

        async function renderWishlist() {
            const grid = document.getElementById("wishlistDisplayGridTarget");
            if(!grid) return;
            const wishIds = StoreApp.state.wishlist;

            if(wishIds.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-zinc-500 py-12">Your desires manifest is empty.</p>`;
                return;
            }

            let cardsHtml = "";
            for(const id of wishIds) {
                const p = await dbEngine.getDocument("products", id);
                if(p) {
                    cardsHtml += `
                        <div class="luxury-card p-6 flex flex-col justify-between">
                            <div>
                                <a href="product.html?id=${p.id}">
                                    <img src="${p.image}" class="w-full h-76 object-cover border border-zinc-800 mb-4">
                                </a>
                                <h3 class="text-xl font-light mb-2 text-white">${StoreApp.state.lang === 'en' ? p.nameEn : p.nameAr}</h3>
                            </div>
                            <div class="flex justify-between items-center pt-4 border-t border-zinc-800">
                                <span class="text-amber-400 font-bold">$${p.price}</span>
                                <button type="button" onclick="CartEngine.addToCart('${p.id}')" class="text-xs px-3 py-2 bg-amber-500 text-black uppercase tracking-wider font-bold hover:bg-white transition">To Trunk</button>
                            </div>
                        </div>
                    `;
                }
            }
            grid.innerHTML = cardsHtml;
        }

        document.addEventListener("DOMContentLoaded", () => renderWishlist());
    </script>
</body>
</html>
