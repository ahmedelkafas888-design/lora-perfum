<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - LORA</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .detail-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 30px; }
        .detail-img { width: 100%; height: auto; object-fit: cover; background: var(--off-white); border: 1px solid var(--gray-light); }
        .detail-info { display: flex; flex-direction: column; justify-content: center; }
        .detail-meta-row { margin: 15px 0; font-size: 0.9rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">LORA</a>
            <div class="nav-icons"><a href="cart.html" class="nav-icon-btn"><i class="fa-solid fa-bag-shopping"></i><span class="badge" id="cartCount">0</span></a></div>
        </div>
    </nav>

    <main class="container">
        <div class="detail-wrapper" id="productDetailView">
            </div>
    </main>

    <script type="module">
        import { db, doc, getDoc } from './firebase.js';
        const params = new URLSearchParams(window.location.search);
        const pid = params.get('id');

        async function fetchSelectedProduct() {
            if(!pid) return;
            const snap = await getDoc(doc(db, "products", pid));
            if(snap.exists()) {
                const data = snap.data();
                const isOut = parseInt(data.stock || 0) <= 0;
                const priceHtml = data.discountPrice ? 
                    `<span class="current-price">${data.discountPrice} EGP</span><span class="old-price">${data.price} EGP</span>` :
                    `<span class="current-price">${data.price} EGP</span>`;
                
                document.getElementById('productDetailView').innerHTML = `
                    <img src="${data.imageUrl}" class="detail-img" alt="${data.title}">
                    <div class="detail-info">
                        <h1 class="luxury-title" style="text-align:left;">${data.title}</h1>
                        <p style="color:var(--gold-dark); text-transform:uppercase; font-size:0.8rem; letter-spacing:1px; margin-bottom:15px;">Category: ${data.category || 'Unisex'}</p>
                        <div class="price-container" style="justify-content:flex-start; font-size:1.3rem;">${priceHtml}</div>
                        <div class="detail-meta-row"><strong>Size:</strong> ${data.size || '100'} ML</div>
                        <div class="detail-meta-row">${isOut ? '<span style="color:var(--red-alert); font-weight:bold;">SOLD OUT</span>' : 'Available in Stock'}</div>
                        <button class="btn-checkout-action" id="detailBuyBtn" ${isOut ? 'disabled' : ''} style="margin-top:20px;">BUY NOW DIRECTLY</button>
                    </div>
                `;
                
                if(!isOut) {
                    document.getElementById('detailBuyBtn').addEventListener('click', () => {
                        const directItem = {
                            id: pid,
                            title: data.title,
                            price: parseFloat(data.discountPrice || data.price),
                            imageUrl: data.imageUrl,
                            size: data.size || '100',
                            qty: 1
                        };
                        localStorage.setItem('lora_direct_item', JSON.stringify(directItem));
                        window.location.href = 'checkout.html?direct=true';
                    });
                }
            }
        }
        fetchSelectedProduct();
    </script>
</body>
</html>
