<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - LORA</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .detail-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; margin-top: 40px; }
        .detail-img { width: 100%; object-fit: cover; background: var(--off-white); }
        .detail-info { display: flex; flex-direction: column; justify-content: center; }
        @media (max-width: 768px) { .detail-wrapper { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="brand-logo">LORA</a>
            <div class="nav-icons"><a href="cart.html" class="nav-icon-btn"><i class="fa-solid fa-bag-shopping"></i><span class="badge" id="cartCount">0</span></a></div>
        </div>
    </nav>

    <main class="container id-fallback-padding">
        <div class="detail-wrapper" id="productDetailsWrapper">
            </div>
    </main>

    <script type="module">
        import { db, doc, getDoc } from './firebase.js';
        const params = new URLSearchParams(window.location.search);
        const productId = params.get('id');

        async function loadProduct() {
            if(!productId) return;
            const docRef = doc(db, "products", productId);
            const snap = await getDoc(docRef);
            if(snap.exists()) {
                const p = snap.data();
                document.getElementById('productDetailsWrapper').innerHTML = `
                    <img src="${p.imageUrl}" class="detail-img" alt="${p.title}">
                    <div class="detail-info">
                        <span class="product-brand">${p.brand || 'LORA'}</span>
                        <h1 class="luxury-title" style="text-align:left; margin-bottom:15px;">${p.title}</h1>
                        <p style="margin-bottom:20px; color:var(--gray-muted);">${p.description || ''}</p>
                        <div class="price-container" style="justify-content:flex-start; font-size:1.5rem;">
                            <span class="current-price">${p.price} AED</span>
                        </div>
                        <button class="btn-checkout-action" id="detailBuyNow" style="max-width:300px;">BUY NOW</button>
                    </div>
                `;
                document.getElementById('detailBuyNow').addEventListener('click', () => {
                    localStorage.setItem('direct_checkout_item', JSON.stringify({
                        id: productId, title: p.title, price: p.price, imageUrl: p.imageUrl, qty: 1
                    }));
                    window.location.href = 'checkout.html?direct=true';
                });
            }
        }
        loadProduct();
    </script>
</body>
</html>
