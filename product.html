<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Composition Profile | Maison De Parfum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="store-container nav-wrapper">
            <button id="langSwitcherBtn" class="text-xs tracking-widest uppercase font-bold text-amber-500">العربية</button>
            <a href="index.html" class="text-2xl tracking-[0.2em] font-light luxury-heading gold-gradient-text">MAISON DE PARFUM</a>
            <nav class="hidden md:flex gap-8">
                <ul class="nav-links">
                    <li><a href="index.html" data-i18n="navHome">Home</a></li>
                    <li><a href="products.html" data-i18n="navProducts">Fragrances</a></li>
                    <li><a href="wishlist.html" data-i18n="navWishlist">Wishlist</a></li>
                    <li><a href="admin.html" data-i18n="navAdmin">Atelier Panel</a></li>
                </ul>
            </nav>
            <div class="nav-icons">
                <a href="wishlist.html" class="icon-btn"><span>♥</span><span id="wishlistCountBadge" class="badge">0</span></a>
                <a href="cart.html" class="icon-btn"><span>🛒</span><span id="cartCountBadge" class="badge">0</span></a>
            </div>
        </div>
    </header>

    <main class="pt-[140px] store-container pb-24">
        <div id="productIsolationFocusTarget" class="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
            </div>
    </main>

    <script type="module" src="firebase.js"></script>
    <script type="module" src="script.js"></script>
    <script type="module">
        import { dbEngine } from "./firebase.js";
        import { StoreApp } from "./script.js";
        import { CartEngine } from "./cart.js";

        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get("id");
            const wrapper = document.getElementById("productIsolationFocusTarget");
            if (!wrapper) return;

            if(!targetId) {
                wrapper.innerHTML = `<p class="text-center text-zinc-500 col-span-2">No unique configuration context signature provided.</p>`;
                return;
            }

            const item = await dbEngine.getDocument("products", targetId);
            if (!item) {
                wrapper.innerHTML = `<p class="text-center text-zinc-500 col-span-2">Specified singular composition context not discovered in database system records.</p>`;
                return;
            }

            wrapper.innerHTML = `
                <div class="border border-zinc-800 p-4 bg-zinc-900/20">
                    <img src="${item.image}" class="w-full h-[500px] object-cover">
                </div>
                <div class="space-y-6">
                    <span class="text-xs uppercase tracking-[0.2em] text-amber-500 font-bold">${item.category}</span>
                    <h1 class="text-4xl font-light text-white tracking-wide">${StoreApp.state.lang === 'en' ? item.nameEn : item.nameAr}</h1>
                    <div class="text-2xl font-light text-amber-300">$${item.price}</div>
                    <p class="text-sm text-zinc-400 leading-relaxed">${StoreApp.state.lang === 'en' ? item.descEn : item.descAr}</p>
                    <div class="pt-6 border-t border-zinc-800 flex items-center gap-4">
                        <input type="number" id="standaloneAllocationQty" value="1" min="1" class="w-20 luxury-input text-center">
                        <button type="button" onclick="CartEngine.addToCart('${item.id}', parseInt(document.getElementById('standaloneAllocationQty').value))" class="premium-btn w-full">${StoreApp.dictionary[StoreApp.state.lang].addToCart}</button>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
