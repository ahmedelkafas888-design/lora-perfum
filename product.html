<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Composition Profile | LORA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <button id="langSwitcherBtn" class="text-xs tracking-widest uppercase font-bold text-amber-500">العربية</button>
            <a href="index.html" class="brand-logo">LORA</a>
            <nav class="hidden md:flex">
                <ul class="nav-links">
                    <li><a href="index.html" data-i18n="navHome">Home</a></li>
                    <li><a href="products.html" data-i18n="navProducts">Fragrances</a></li>
                    <li><a href="wishlist.html" data-i18n="navWishlist">Wishlist</a></li>
                    <li><a href="admin.html" data-i18n="navAdmin">Atelier Vault</a></li>
                </ul>
            </nav>
            <div class="nav-actions">
                <a href="wishlist.html" class="icon-btn text-xl relative">♥<span id="wishlistCountBadge" class="badge">0</span></a>
                <a href="cart.html" class="icon-btn text-xl relative">🛒<span id="cartCountBadge" class="badge">0</span></a>
            </div>
        </div>
    </header>

    <main class="pt-[140px] max-w-6xl mx-auto px-8 pb-24">
        <div id="standaloneFocusIsolationProfileWrapper" class="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
            </div>
    </main>

    <div id="globalLoraSystemNotificationToast" class="luxury-toast-message"></div>

    <script type="module" src="firebase.js"></script>
    <script type="module" src="script.js"></script>
    <script type="module" src="cart.js"></script>
    <script type="module">
        import { LoraProductsEngine } from "./products.js";
        import { LoraApp } from "./script.js";
        import { LoraCartController } from "./cart.js";

        document.addEventListener("DOMContentLoaded", async () => {
            const wrapper = document.getElementById("standaloneFocusIsolationProfileWrapper");
            if (!wrapper) return;

            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get("id");

            if (!targetId) {
                wrapper.innerHTML = `<p class="text-center font-sans text-xs text-zinc-400">No matching singular composition trace parameters defined inside index location locator state.</p>`;
                return;
            }

            const itemDataNode = await LoraProductsEngine.retrieveSingleProduct(targetId);
            if (!itemDataNode) {
                wrapper.innerHTML = `<p class="text-center font-sans text-xs text-zinc-400">Product asset records not active inside live data schema.</p>`;
                return;
            }

            window.localIsolatedContextActiveSizesMatrix = itemDataNode.sizesMatrix || [];

            wrapper.innerHTML = `
                <div class="border border-zinc-200 p-4 bg-[#faf9f6]">
                    <img src="${itemDataNode.image}" class="w-full h-[500px] object-cover">
                </div>
                <div class="space-y-6">
                    <span class="text-xs font-mono uppercase text-amber-500 tracking-widest font-bold">${itemDataNode.category} Collection</span>
                    <h1 class="text-3xl font-light text-zinc-900">${LoraApp.state.lang === 'en' ? itemDataNode.nameEn : itemDataNode.nameAr}</h1>
                    
                    <div>
                        <label class="block text-[10px] uppercase tracking-widest text-zinc-400 mb-2">Select Volumetric Bottle Size</label>
                        <select id="sizeMatrixSelectorNodeDropdown" onchange="window.updateContextPriceDisplayElement(this.value)" class="luxury-dropdown-input">
                            ${window.localIsolatedContextActiveSizesMatrix.map((n, idx) => `<option value="${idx}">${n.sizeLabel}</option>`).join('')}
                        </select>
                    </div>

                    <div class="text-2xl font-bold text-zinc-900" id="contextualDynamicPriceDisplayField">
                        $0.00
                    </div>

                    <p class="text-sm text-zinc-500 leading-relaxed font-sans">${LoraApp.state.lang === 'en' ? itemDataNode.descEn : itemDataNode.descAr}</p>
                    
                    <div class="pt-6 border-t border-zinc-100">
                        ${itemDataNode.stockStatus === 'outofstock' ? 
                            `<button class="w-full bg-zinc-300 text-zinc-500 text-xs font-bold uppercase tracking-widest py-4 cursor-not-allowed" disabled>Sold Out</button>` :
                            `<button onclick="window.executeCartAdditionSequence('${itemDataNode.id}')" class="premium-btn w-full text-xs" data-i18n="addToCart">Add to Bag</button>`
                        }
                    </div>
                </div>
            `;

            window.updateContextPriceDisplayElement = function(indexVal) {
                const displayNode = document.getElementById("contextualDynamicPriceDisplayField");
                const matchedNode = window.localIsolatedContextActiveSizesMatrix[parseInt(indexVal)];
                if (matchedNode && displayNode) {
                    displayNode.innerText = `$${matchedNode.priceValue}`;
                }
            };

            window.executeCartAdditionSequence = function(prodId) {
                const selector = document.getElementById("sizeMatrixSelectorNodeDropdown");
                const chosenIdx = parseInt(selector.value);
                const matchedNode = window.localIsolatedContextActiveSizesMatrix[chosenIdx];
                if (matchedNode) {
                    LoraCartController.addItemToCart(prodId, matchedNode.sizeLabel, matchedNode.priceValue);
                }
            };

            window.updateContextPriceDisplayElement(0);
        });
    </script>
</body>
</html>
