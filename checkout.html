<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - LORA</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@600&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container">
        <h1 class="luxury-title" style="margin-top:40px;">SECURE CHECKOUT</h1>
        <div class="workspace-split">
            <div class="items-panel">
                <h3 class="summary-title">Delivery Details</h3>
                <form id="checkoutForm">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="custName" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="custPhone" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Shipping Address</label>
                        <textarea id="custAddress" class="form-control" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn-checkout-action">PLACE ORDER VIA WHATSAPP</button>
                </form>
            </div>

            <div class="summary-panel">
                <h3 class="summary-title">Your Order</h3>
                <div id="checkoutItemsReview" style="margin-bottom:20px;"></div>
                
                <div class="promo-box">
                    <label class="promo-label">Promo Code</label>
                    <div class="promo-row">
                        <input type="text" id="checkoutCouponInput" class="promo-input">
                        <button id="checkoutApplyCouponBtn" class="promo-btn">Apply</button>
                    </div>
                    <div id="checkoutCouponFeedback" class="feedback-msg"></div>
                </div>

                <div class="summary-row"><span>Subtotal</span><span><span id="chkSubtotal">0.00</span> AED</span></div>
                <div class="summary-row discount"><span>Discount</span><span>-<span id="chkDiscount">0.00</span> AED</span></div>
                <div class="summary-row total"><span>Final Total</span><span><span id="chkTotal">0.00</span> AED</span></div>
            </div>
        </div>
    </main>

    <script type="module">
        import { db, doc, getDoc } from './firebase.js';

        let isDirect = new URLSearchParams(window.location.search).get('direct') === 'true';
        let checkoutItems = [];
        let activeDiscountPercent = parseFloat(localStorage.getItem('lora_active_discount') || '0');

        function initCheckout() {
            if(isDirect) {
                const item = JSON.parse(localStorage.getItem('direct_checkout_item'));
                if(item) checkoutItems = [item];
            } else {
                checkoutItems = JSON.parse(localStorage.getItem('lora_cart') || '[]');
            }
            renderReview();
            syncTotals();
        }

        function renderReview() {
            const container = document.getElementById('checkoutItemsReview');
            container.innerHTML = checkoutItems.map(i => `
                <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:0.9rem;">
                    <span>${i.title} (x${i.qty})</span>
                    <span>${(i.price * i.qty)} AED</span>
                </div>
            `).join('');
        }

        function syncTotals() {
            let subtotal = checkoutItems.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);
            let discount = subtotal * (activeDiscountPercent / 100);
            let total = subtotal - discount;

            document.getElementById('chkSubtotal').innerText = subtotal.toFixed(2);
            document.getElementById('chkDiscount').innerText = discount.toFixed(2);
            document.getElementById('chkTotal').innerText = total.toFixed(2);
            
            const code = localStorage.getItem('lora_coupon_code');
            if(code) {
                document.getElementById('checkoutCouponInput').value = code;
                document.getElementById('checkoutCouponFeedback').className = "feedback-msg success";
                document.getElementById('checkoutCouponFeedback').innerText = `Coupon Active: ${activeDiscountPercent}% Off`;
            }
        }

        document.getElementById('checkoutApplyCouponBtn').addEventListener('click', async () => {
            const inputCode = document.getElementById('checkoutCouponInput').value.trim().toUpperCase();
            const feed = document.getElementById('checkoutCouponFeedback');
            if(!inputCode) return;

            const snap = await getDoc(doc(db, "coupons", inputCode));
            if(snap.exists() && snap.data().active) {
                activeDiscountPercent = parseFloat(snap.data().percentage || 0);
                localStorage.setItem('lora_active_discount', activeDiscountPercent);
                localStorage.setItem('lora_coupon_code', inputCode);
                feed.className = "feedback-msg success";
                feed.innerText = "Coupon applied successfully!";
                syncTotals();
            } else {
                feed.className = "feedback-msg error";
                feed.innerText = "Invalid coupon code.";
            }
        });

        document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const settingsSnap = await getDoc(doc(db, "store", "settings"));
            let whatsappNum = "971500000000"; 
            if(settingsSnap.exists() && settingsSnap.data().whatsapp) {
                whatsappNum = settingsSnap.data().whatsapp;
            }

            let msg = `*NEW LORA ORDER*\n\n`;
            msg += `*Customer:* ${document.getElementById('custName').value}\n`;
            msg += `*Phone:* ${document.getElementById('custPhone').value}\n`;
            msg += `*Address:* ${document.getElementById('custAddress').value}\n\n`;
            msg += `*Items ordered:*\n`;
            checkoutItems.forEach(i => { msg += `- ${i.title} (x${i.qty}) [${i.price} AED]\n`; });
            msg += `\n*Final Total:* ${document.getElementById('chkTotal').innerText} AED`;

            localStorage.removeItem('lora_cart');
            localStorage.removeItem('lora_active_discount');
            localStorage.removeItem('lora_coupon_code');
            window.open(`https://wa.me/${whatsappNum}?text=${encodeURIComponent(msg)}`, '_blank');
        });

        initCheckout();
    </script>
</body>
</html>
