<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics Gateway | LORA</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="toast-container" class="toast-container"></div>

    <header>
        <div class="nav-container">
            <div class="lang-switch-wrapper">
                <button onclick="toggleLanguageSystem()" class="lang-toggle-btn" id="lang-btn">العربية</button>
            </div>
            <a href="index.html" class="logo">LORA</a>
        </div>
    </header>

    <section class="container checkout-container">
        <h1 class="section-title" data-i18n="delivery_matrix_hdr">Delivery Matrix</h1>
        
        <form id="checkout-form" onsubmit="processOrder(event)">
            <div class="form-group">
                <label for="fullName" data-i18n="lbl_name">Full Name</label>
                <input type="text" id="fullName" required placeholder="Full Identity Reference">
            </div>
            <div class="form-group">
                <label for="phone" data-i18n="lbl_phone">Phone Contact</label>
                <input type="tel" id="phone" required placeholder="e.g., +201208711729">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="country" data-i18n="lbl_country">Country Zone</label>
                    <input type="text" id="country" value="Egypt" required readonly>
                </div>
                <div class="form-group">
                    <label for="governorate" data-i18n="lbl_gov">Governorate</label>
                    <select id="governorate" required>
                        <option value="" disabled selected data-i18n="opt_select_gov">Select Governorate</option>
                        <option value="Cairo">Cairo / القاهرة</option>
                        <option value="Giza">Giza / الجيزة</option>
                        <option value="Alexandria">Alexandria / الإسكندرية</option>
                        <option value="Dakahlia">Dakahlia / الدقهلية</option>
                        <option value="Sharqia">Sharqia / الشرقية</option>
                        <option value="Gharbia">Gharbia / الغربية</option>
                        <option value="Monufia">Monufia / المنوفية</option>
                        <option value="Kafr El Sheikh">Kafr El Sheikh / كفر الشيخ</option>
                        <option value="Beheira">Beheira / البحيرة</option>
                        <option value="Damietta">Damietta / دمياط</option>
                        <option value="Port Said">Port Said / بورفؤاد - بورسعيد</option>
                        <option value="Ismailia">Ismailia / الإسماعيلية</option>
                        <option value="Suez">Suez / السويس</option>
                        <option value="North Sinai">North Sinai / شمال سيناء</option>
                        <option value="South Sinai">South Sinai / جنوب سيناء</option>
                        <option value="Faiyum">Faiyum / الفيوم</option>
                        <option value="Beni Suef">Beni Suef / بني سويف</option>
                        <option value="Minya">Minya / المنيا</option>
                        <option value="Assiut">Assiut / أسيوط</option>
                        <option value="Sohag">Sohag / سوهاج</option>
                        <option value="Qena">Qena / قنا</option>
                        <option value="Luxor">Luxor / الأقصر</option>
                        <option value="Aswan">Aswan / أسوان</option>
                        <option value="Red Sea">Red Sea / البحر الأحمر</option>
                        <option value="New Valley">New Valley / الوادي الجديد</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="city" data-i18n="lbl_city">City / District</label>
                    <input type="text" id="city" required placeholder="District Specification">
                </div>
                <div class="form-group">
                    <label for="address" data-i18n="lbl_address">Residential Address Line</label>
                    <input type="text" id="address" required placeholder="Street, Villa, Suite Context">
                </div>
            </div>
            
            <button type="submit" class="btn order-submit-btn" data-i18n="btn_submit_order">Authorize Order & Route via WhatsApp</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 LORA. <span data-i18n="footer_rights">All Rights Reserved.</span></p>
    </footer>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initApp();
            applyLanguageDOM();
            if (getCart().length === 0) window.location.href = 'cart.html';
        });

        function processOrder(e) {
            e.preventDefault();
            const isAr = getCurrentLang() === 'ar';
            
            const customer = {
                name: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                country: document.getElementById('country').value,
                governorate: document.getElementById('governorate').value,
                city: document.getElementById('city').value,
                address: document.getElementById('address').value
            };

            const cart = getCart();
            const products = getProducts();
            let subtotalEGP = 0;
            let manifests = "";

            cart.forEach((item, index) => {
                const prod = products.find(p => p.id === item.id);
                if (prod) {
                    const finalLineEgp = calculateFinalPrice(prod.price, prod.discount);
                    const cumulativeEgp = finalLineEgp * item.quantity;
                    subtotalEGP += cumulativeEgp;
                    manifests += `${index + 1}. ${prod.name} (${prod.bottleSize || '100ML'}) [x${item.quantity}] @ ${finalLineEgp.toFixed(0)} EGP\n`;
                }
            });

            const coupon = JSON.parse(localStorage.getItem('lora_applied_coupon'));
            let totalPayable = subtotalEGP;
            let couponLabel = "None Provided";
            
            if (coupon) {
                totalPayable = subtotalEGP - (subtotalEGP * (parseInt(coupon.percentage) / 100));
                couponLabel = `${coupon.code} (-${coupon.percentage}%)`;
            }

            const activeOrders = JSON.parse(localStorage.getItem('lora_orders')) || [];
            activeOrders.push({
                id: 'LORA-ORD-' + Date.now().toString().slice(-6),
                customer: customer,
                items: cart,
                coupon: couponLabel,
                totalEGP: totalPayable.toFixed(0),
                date: new Date().toLocaleDateString('en-US')
            });
            localStorage.setItem('lora_orders', JSON.stringify(activeOrders));

            const payloadText = `✨ *OFFICIAL PURCHASE ORDER - LORA* ✨\n\n` +
                                `👤 *CLIENT PROFILE:*\n` +
                                `▪️ *Name:* ${customer.name}\n` +
                                `▪️ *Phone Line:* ${customer.phone}\n` +
                                `▪️ *Logistics:* ${customer.address}, ${customer.city}, ${customer.governorate}, ${customer.country}\n\n` +
                                `📦 *MANIFEST CONTENT:*\n` +
                                `${manifests}\n` +
                                `🎫 *COUPON AUDIT:* ${couponLabel}\n` +
                                `💰 *NET CHARGE TO PAY:* ${totalPayable.toFixed(0)} EGP\n\n` +
                                `Thank you for choosing LORA. Tracking initiated.`;

            const encoded = encodeURIComponent(payloadText);
            
            showToastNotification(isAr ? "✓ تم تسجيل طلبك بنجاح! جاري تحويلك..." : "✓ Order submitted successfully! Routing...");
            
            localStorage.removeItem('lora_cart');
            localStorage.removeItem('lora_applied_coupon');
            
            setTimeout(() => {
                window.open(`https://wa.me/201208711729?text=${encoded}`, '_blank');
                window.location.href = 'index.html';
            }, 1200);
        }
    </script>
</body>
</html>
