<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Verification Checkout | LORA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <button id="langSwitcherBtn" class="text-xs tracking-widest uppercase font-bold text-amber-500">العربية</button>
            <a href="index.html" class="brand-logo">LORA</a>
            <nav class="hidden md:flex">
                <ul class="nav-links">
                    <li><a href="index.html" data-i18n="navHome">Home</a></li>
                    <li><a href="products.html" data-i18n="navProducts">Fragrances</a></li>
                    <li><a href="wishlist.html" data-i18n="navWishlist">Wishlist</a></li>
                    <li><a href="admin.html" data-i18n="navAdmin">Atelier Vault</a></li>
                </ul>
            </nav>
            <div class="nav-actions">
                <a href="wishlist.html" class="icon-btn text-xl relative">♥<span id="wishlistCountBadge" class="badge">0</span></a>
                <a href="cart.html" class="icon-btn text-xl relative">🛒<span id="cartCountBadge" class="badge">0</span></a>
            </div>
        </div>
    </header>

    <main class="pt-[140px] max-w-3xl mx-auto px-8 pb-24">
        <div class="bg-[#faf9f6] border border-zinc-200 p-8 md:p-12">
            <h1 class="text-2xl tracking-widest uppercase mb-8 border-b border-zinc-200 pb-4 text-zinc-900 font-light" data-i18n="checkoutBtn">Secure Customer Logistics Checkout</h1>
            
            <form id="loraBoutiqueCustomerCheckoutFormCollection" class="space-y-6 font-sans text-xs">
                <div>
                    <label class="block uppercase tracking-wider text-zinc-500 mb-2 font-medium" data-i18n="fullName">Full Name</label>
                    <input type="text" id="chkFullName" required class="w-full bg-white border border-zinc-300 text-zinc-800 p-3 text-xs tracking-wide focus:outline-none focus:border-amber-500">
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block uppercase tracking-wider text-zinc-500 mb-2 font-medium" data-i18n="phoneNumber">Phone Number</label>
                        <input type="tel" id="chkPhoneNumber" required class="w-full bg-white border border-zinc-300 text-zinc-800 p-3 text-xs tracking-wide focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block uppercase tracking-wider text-zinc-500 mb-2 font-medium" data-i18n="govName">Governorate</label>
                        <input type="text" id="chkGovernorate" required class="w-full bg-white border border-zinc-300 text-zinc-800 p-3 text-xs tracking-wide focus:outline-none focus:border-amber-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block uppercase tracking-wider text-zinc-500 mb-2 font-medium" data-i18n="cityName">City</label>
                        <input type="text" id="chkCity" required class="w-full bg-white border border-zinc-300 text-zinc-800 p-3 text-xs tracking-wide focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block uppercase tracking-wider text-zinc-500 mb-2 font-medium" data-i18n="fullAddress">Exact Delivery Address</label>
                        <input type="text" id="chkAddress" required class="w-full bg-white border border-zinc-300 text-zinc-800 p-3 text-xs tracking-wide focus:outline-none focus:border-amber-500">
                    </div>
                </div>

                <div>
                    <label class="block uppercase tracking-wider text-zinc-500 mb-2 font-medium" data-i18n="orderNotes">Manifest Allocation Notes</label>
                    <textarea id="chkNotes" rows="3" class="w-full bg-white border border-zinc-300 text-zinc-800 p-3 text-xs tracking-wide focus:outline-none focus:border-amber-500"></textarea>
                </div>

                <div class="pt-6 border-t border-zinc-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <div class="text-center sm:text-left">
                        <p class="text-zinc-400 uppercase tracking-widest text-[10px]">Total Order Price</p>
                        <p id="checkoutBillableSummaryTotalAggregateDisplay" class="text-2xl font-serif text-zinc-900 font-bold">$0.00</p>
                    </div>
                    <button type="submit" class="premium-btn w-full sm:w-auto text-xs tracking-widest bg-zinc-900 text-white" data-i18n="executeCheckout">Confirm Purchase via WhatsApp Verification</button>
                </div>
            </form>
        </div>
    </main>

    <div id="globalLoraSystemNotificationToast" class="luxury-toast-message"></div>

    <script type="module" src="firebase.js"></script>
    <script type="module" src="script.js"></script>
    <script type="module">
        import { LoraProductsEngine } from "./products.js";
        import { LoraApp } from "./script.js";

        let calculatedGrandTotalBillableAmount = 0;
        let generatedCompiledManifestPayloadString = "";

        document.addEventListener("DOMContentLoaded", async () => {
            const listItems = LoraApp.state.cart;
            const textDisplayNode = document.getElementById("checkoutBillableSummaryTotalAggregateDisplay");
            if (listItems.length === 0) {
                window.location.href = "cart.html";
                return;
            }

            let textBuilderLines = "LORA PERFUME STORE ORDER MANIFEST\n===============================\n";
            let indexTrackerCount = 1;

            for (const rowItem of listItems) {
                const mapRef = await LoraProductsEngine.retrieveSingleProduct(rowItem.id);
                if (mapRef) {
                    const rowCost = rowItem.price * rowItem.qty;
                    calculatedGrandTotalBillableAmount += rowCost;
                    textBuilderLines += `${indexTrackerCount}. ${mapRef.nameEn} [Size: ${rowItem.selectedSize}] x${rowItem.qty} -> $${rowCost}\n`;
                    indexTrackerCount++;
                }
            }

            if (textDisplayNode) textDisplayNode.innerText = `$${calculatedGrandTotalBillableAmount}`;
            generatedCompiledManifestPayloadString = textBuilderLines;
        });

        document.getElementById("loraBoutiqueCustomerCheckoutFormCollection").addEventListener("submit", (e) => {
            e.preventDefault();

            const cName = document.getElementById("chkFullName").value.trim();
            const cPhone = document.getElementById("chkPhoneNumber").value.trim();
            const cGov = document.getElementById("chkGovernorate").value.trim();
            const cCity = document.getElementById("chkCity").value.trim();
            const cAdd = document.getElementById("chkAddress").value.trim();
            const cNote = document.getElementById("chkNotes").value.trim();

            let trackingFinalMessageText = generatedCompiledManifestPayloadString;
            trackingFinalMessageText += `\n===============================\nTOTAL AGGREGATE VALUATION: $${calculatedGrandTotalBillableAmount}\n\nCUSTOMER LOGISTICS DATA:\n`;
            trackingFinalMessageText += `• Name: ${cName}\n• Phone: ${cPhone}\n• Region/Gov: ${cGov}\n• City: ${cCity}\n• Address: ${cAdd}\n• Dispatch Instructions: ${cNote || 'None'}`;

            const finalTargetWhatsAppURL = LoraApp.generateWhatsAppRedirectionLink(trackingFinalMessageText);
            
            localStorage.removeItem("lora_brand_cart");
            LoraApp.synchronizeBadgeMetrics();
            
            window.location.href = finalTargetWhatsAppURL;
        });
    </script>
</body>
</html>
