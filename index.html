<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LORA | Haute Parfumerie Excellence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <button id="langSwitcherBtn" class="text-xs tracking-widest uppercase font-bold text-amber-500">العربية</button>
            <a href="index.html" class="brand-logo">LORA</a>
            <nav class="hidden md:flex">
                <ul class="nav-links">
                    <li><a href="index.html" data-i18n="navHome">Home</a></li>
                    <li><a href="products.html" data-i18n="navProducts">Fragrances</a></li>
                    <li><a href="wishlist.html" data-i18n="navWishlist">Wishlist</a></li>
                    <li><a href="admin.html" data-i18n="navAdmin">Atelier Vault</a></li>
                </ul>
            </nav>
            <div class="nav-actions">
                <a href="wishlist.html" class="icon-btn text-xl relative">♥<span id="wishlistCountBadge" class="badge">0</span></a>
                <a href="cart.html" class="icon-btn text-xl relative">🛒<span id="cartCountBadge" class="badge">0</span></a>
            </div>
        </div>
    </header>

    <main class="pt-[90px]">
        <section class="hero-viewport">
            <div class="hero-overlay-graphic"></div>
            <div class="hero-center-branding">
                <h1 class="hero-logo-text">LORA</h1>
                <p class="text-xs tracking-[0.4em] text-amber-400 uppercase font-light mb-8 max-w-md mx-auto" data-i18n="promoText">Exclusive Discounts & Special Offers</p>
                <a href="products.html" class="premium-gold-btn text-xs tracking-widest px-8 py-3" data-i18n="navProducts">Explore Collections</a>
            </div>
        </section>

        <section class="grid grid-cols-1 md:grid-cols-2 gap-0 border-t border-b border-zinc-200">
            <div class="relative group h-[600px] overflow-hidden bg-stone-900 flex items-center justify-center text-center">
                <img src="https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&w=1200&q=80" class="absolute inset-0 w-full h-full object-cover opacity-60 transition duration-700 group-hover:scale-105">
                <div class="absolute inset-0 bg-black/30"></div>
                <div class="relative z-10 p-8">
                    <h2 class="text-3xl tracking-[0.3em] font-light text-white mb-4" data-i18n="mensTitle">MEN'S COLLECTION</h2>
                    <a href="products.html?cat=men" class="text-xs text-amber-400 tracking-widest uppercase border-b border-amber-400 pb-1 hover:text-white hover:border-white transition">Discover More</a>
                </div>
            </div>

            <div class="relative group h-[600px] overflow-hidden bg-stone-900 flex items-center justify-center text-center">
                <img src="https://images.unsplash.com/photo-1594035910387-fea47794261f?auto=format&fit=crop&w=1200&q=80" class="absolute inset-0 w-full h-full object-cover opacity-60 transition duration-700 group-hover:scale-105">
                <div class="absolute inset-0 bg-black/30"></div>
                <div class="relative z-10 p-8">
                    <h2 class="text-3xl tracking-[0.3em] font-light text-white mb-4" data-i18n="womensTitle">WOMEN'S COLLECTION</h2>
                    <a href="products.html?cat=women" class="text-xs text-amber-400 tracking-widest uppercase border-b border-amber-400 pb-1 hover:text-white hover:border-white transition">Discover More</a>
                </div>
            </div>
        </section>

        <section class="py-24 bg-[#faf9f6]">
            <div class="max-w-7xl mx-auto px-8">
                <h3 class="text-2xl tracking-widest text-center uppercase mb-16 font-light text-zinc-800">Signature Compositions</h3>
                <div id="indexFeaturedProductsInjectionTarget" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                    </div>
            </div>
        </section>
    </main>

    <footer class="bg-black text-white text-center py-12 text-[11px] tracking-[0.25em] text-zinc-500 uppercase border-t border-zinc-900">
        <p>&copy; 2026 LORA HAUTE PARFUMERIE. ALL RIGHTS RESERVED.</p>
    </footer>

    <div id="globalLoraSystemNotificationToast" class="luxury-toast-message"></div>

    <script type="module" src="firebase.js"></script>
    <script type="module" src="script.js"></script>
    <script type="module">
        import { LoraProductsEngine } from "./products.js";
        import { LoraApp } from "./script.js";

        document.addEventListener("DOMContentLoaded", async () => {
            const container = document.getElementById("indexFeaturedProductsInjectionTarget");
            if (!container) return;

            const list = await LoraProductsEngine.retrieveAllActiveProducts();
            if(list.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-zinc-400 text-xs uppercase tracking-widest font-sans">No fragrances currently loaded in curated showcase view.</p>`;
                return;
            }

            container.innerHTML = list.slice(0, 3).map(p => {
                const baseSizeNode = p.sizesMatrix && p.sizesMatrix.length > 0 ? p.sizesMatrix[0] : { sizeLabel: 'Default', priceValue: 0 };
                return `
                    <div class="product-luxury-card flex flex-col justify-between">
                        <div>
                            <div class="overflow-hidden bg-white border border-zinc-100 mb-6 relative">
                                <img src="${p.image}" class="w-full h-80 object-cover transition duration-500 hover:scale-105">
                                ${p.stockStatus === 'outofstock' ? `<span class="absolute top-4 left-4 bg-black text-white text-[9px] tracking-widest uppercase px-2 py-1">Out of Stock</span>` : ''}
                            </div>
                            <h4 class="text-lg font-light mb-1 tracking-wide text-zinc-900">${LoraApp.state.lang === 'en' ? p.nameEn : p.nameAr}</h4>
                            <p class="text-xs text-zinc-400 uppercase tracking-widest mb-4">${p.category} Collection</p>
                        </div>
                        <div class="flex justify-between items-center pt-4 border-t border-zinc-100">
                            <span class="text-md font-bold text-zinc-900">$${baseSizeNode.priceValue} <span class="text-xs font-light text-zinc-400 font-mono">(${baseSizeNode.sizeLabel})</span></span>
                            <a href="product.html?id=${p.id}" class="text-xs tracking-widest uppercase text-amber-500 hover:text-black font-bold">View Profile</a>
                        </div>
                    </div>
                `;
            }).join('');
        });
    </script>
</body>
</html>
