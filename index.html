<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LORA PERFUMS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>LORA PERFUMS</h1>
<nav>
<a href="#men">Men</a>
<a href="#women">Women</a>
<a href="#cart">Cart</a>
</nav>
</header>

<section id="men">
<h2>Men Perfumes</h2>
<div class="grid">
<div class="card">
<h3>Black Code</h3>
<p>Price: 500 EGP</p>
<button onclick="addToCart('Black Code',500)">Add</button>
</div>
</div>
</section>

<section id="women">
<h2>Women Perfumes</h2>
<div class="grid">
<div class="card">
<h3>Rose Luxe</h3>
<p>Price: 450 EGP</p>
<button onclick="addToCart('Rose Luxe',450)">Add</button>
</div>
</div>
</section>

<section id="cart">
<h2>Your Cart</h2>
<div id="cartItems"></div>

<h3>Checkout</h3>
<input placeholder="Name" id="name">
<input placeholder="Phone" id="phone">
<input placeholder="City" id="city">
<input placeholder="Address" id="address">

<button onclick="sendWhatsApp()">Confirm Order on WhatsApp</button>
</section>

<script src="app.js"></script>
</body>
</html>
