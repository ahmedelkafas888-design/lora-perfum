<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LORA | Luxury Perfume Collection</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-left">
                <a href="products.html?cat=men" class="nav-link" data-i18n="navMen">Men</a>
                <a href="products.html?cat=women" class="nav-link" data-i18n="navWomen">Women</a>
            </div>
            <div class="nav-logo">
                <a href="index.html" class="logo-brand">LORA</a>
            </div>
            <div class="nav-right">
                <a href="cart.html" class="nav-link cart-link">
                    <span data-i18n="navCart">Cart</span>
                    <span id="cart-count" class="cart-count-badge">0</span>
                </a>
                <a href="admin.html" class="nav-link" data-i18n="navAdmin">Admin</a>
                <button id="lang-toggle" class="lang-switch-btn">العربية</button>
            </div>
        </div>
    </nav>

    <!-- Search Section -->
    <section class="search-section">
        <div class="container">
            <div class="search-wrapper">
                <input type="text" id="global-search" data-i18n-placeholder="searchPlaceholder" placeholder="Search for luxury fragrances...">
                <button id="global-search-btn" class="search-btn" data-i18n="searchBtn">Search</button>
            </div>
        </div>
    </section>

    <!-- Promo Popup Panel -->
    <div id="promo-popup" class="promo-popup hidden">
        <div class="promo-content">
            <h3 id="promo-title">20% OFF</h3>
            <p data-i18n="promoMessage">Use this limited time coupon code at checkout</p>
            <div class="promo-code-box">
                <span id="promo-code-text">LORA20</span>
                <button id="copy-promo-btn" class="btn-secondary" data-i18n="copyCode">Copy Code</button>
            </div>
            <button id="close-promo-btn" class="close-popup-btn">&times;</button>
        </div>
    </div>

    <!-- Hero Banner -->
    <header class="hero-banner">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="hero-brand">LORA</h1>
            <h2 class="hero-subtitle" data-i18n="heroSubtitle">Luxury Perfume Collection</h2>
            <p class="hero-desc" data-i18n="heroDesc">Discover premium fragrances for men and women.</p>
            <div id="hero-discount-announcement" class="hero-discount-alert hidden"></div>
            <a href="products.html" class="btn-primary hero-btn" data-i18n="shopNow">Shop Now</a>
        </div>
    </header>

    <!-- Featured Section -->
    <main class="main-content container">
        <div class="section-header">
            <h2 data-i18n="featuredTitle">Exquisite Highlights</h2>
            <div class="header-line"></div>
        </div>
        <div id="featured-products-grid" class="products-grid">
            <!-- Dynamically populated via app.js -->
        </div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 LORA. All Rights Reserved.</p>
    </footer>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            App.init();
            App.renderFeatured();
        });
    </script>
</body>
</html>
