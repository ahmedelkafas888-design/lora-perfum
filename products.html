<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Master Collection | LORA PARFUMS</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="global-navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">LORA PARFUMS</a>
            <nav class="nav-links-desktop">
                <a href="index.html" data-i18n="nav_home">Home</a>
                <a href="products.html?category=all" id="filter-tab-all" data-i18n="nav_collection">Collection</a>
                <a href="products.html?category=Women" id="filter-tab-women" data-i18n="nav_women">Women Perfumes</a>
                <a href="products.html?category=Men" id="filter-tab-men" data-i18n="nav_men">Men Perfumes</a>
                <a href="admin.html" data-i18n="nav_admin">Admin</a>
            </nav>
            <div class="nav-action-utilities">
                <select id="lang-selector-node" class="lang-minimal-dropdown" onchange="executeLanguageToggle(this.value)">
                    <option value="en">EN</option>
                    <option value="ar">AR</option>
                </select>
                <a href="cart.html" class="cart-anchor-icon">
                    🛒<span id="cart-counter-badge" class="cart-counter-pill">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="viewport-wrapper">
        <section class="catalog-header-banner">
            <h1 id="catalog-header-title" data-i18n="nav_collection">The Master Collection</h1>
            <p data-i18n="catalog_sub">Pure extracts, timeless definitions</p>
        </section>

        <section class="container">
            <div id="master-catalog-grid" class="symmetrical-luxury-grid"></div>
        </section>
    </main>

    <footer class="global-footer-node">
        <p>&copy; 2026 LORA PARFUMS. <span data-i18n="footer_rights">All Rights Reserved.</span></p>
    </footer>

    <script src="app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            initializeDatabaseEngine();
            syncDocumentLocalization();
            updateNavigationCartTotals();

            const queryParameters = new URLSearchParams(window.location.search);
            const targetCategory = queryParameters.get("category") || "all";

            // Enforce selected visual state tracking on links
            document.querySelectorAll(".nav-links-desktop a").forEach(el => el.classList.remove("active"));
            if(targetCategory === "Women") {
                document.getElementById("filter-tab-women").classList.add("active");
                document.getElementById("catalog-header-title").setAttribute("data-i18n", "nav_women");
            } else if(targetCategory === "Men") {
                document.getElementById("filter-tab-men").classList.add("active");
                document.getElementById("catalog-header-title").setAttribute("data-i18n", "nav_men");
            } else {
                document.getElementById("filter-tab-all").classList.add("active");
                document.getElementById("catalog-header-title").setAttribute("data-i18n", "nav_collection");
            }

            const masterProducts = fetchProductsFromStorage();
            const gridContainer = document.getElementById("master-catalog-grid");

            const renderedProducts = targetCategory === "all" 
                ? masterProducts 
                : masterProducts.filter(p => p.category === targetCategory);

            if(renderedProducts.length === 0) {
                gridContainer.innerHTML = `<p class="empty-state-text" style="grid-column:1/-1;" data-i18n="empty_collection">No fragrances found in the collection.</p>`;
            } else {
                renderedProducts.forEach(prod => {
                    gridContainer.appendChild(compileProductGridCardNode(prod));
                });
            }
            syncDocumentLocalization();
        });
    </script>
</body>
</html>
