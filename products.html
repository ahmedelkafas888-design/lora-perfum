<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Catalog Manifest | LORA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <button id="langSwitcherBtn" class="text-xs tracking-widest uppercase font-bold text-amber-500">العربية</button>
            <a href="index.html" class="brand-logo">LORA</a>
            <nav class="hidden md:flex">
                <ul class="nav-links">
                    <li><a href="index.html" data-i18n="navHome">Home</a></li>
                    <li><a href="products.html" data-i18n="navProducts">Fragrances</a></li>
                    <li><a href="wishlist.html" data-i18n="navWishlist">Wishlist</a></li>
                    <li><a href="admin.html" data-i18n="navAdmin">Atelier Vault</a></li>
                </ul>
            </nav>
            <div class="nav-actions">
                <a href="wishlist.html" class="icon-btn text-xl relative">♥<span id="wishlistCountBadge" class="badge">0</span></a>
                <a href="cart.html" class="icon-btn text-xl relative">🛒<span id="cartCountBadge" class="badge">0</span></a>
            </div>
        </div>
    </header>

    <main class="pt-[140px] max-w-7xl mx-auto px-8 pb-24">
        <div class="bg-[#faf9f6] border border-zinc-200 p-6 md:p-8 flex flex-col md:flex-row justify-between items-center gap-6 mb-12">
            <div class="flex flex-wrap gap-3 w-full md:w-auto">
                <button onclick="window.LoraCatalogViewModule.updateFilterCategory('all')" class="px-5 py-2 text-xs uppercase tracking-wider font-medium border border-zinc-300 bg-white text-zinc-800 hover:border-amber-500 transition">All Products</button>
                <button onclick="window.LoraCatalogViewModule.updateFilterCategory('men')" class="px-5 py-2 text-xs uppercase tracking-wider font-medium border border-zinc-200 bg-white text-zinc-500 hover:border-amber-500 transition">Pour Homme</button>
                <button onclick="window.LoraCatalogViewModule.updateFilterCategory('women')" class="px-5 py-2 text-xs uppercase tracking-wider font-medium border border-zinc-200 bg-white text-zinc-500 hover:border-amber-500 transition">Pour Femme</button>
                <button onclick="window.LoraCatalogViewModule.updateFilterCategory('unisex')" class="px-5 py-2 text-xs uppercase tracking-wider font-medium border border-zinc-200 bg-white text-zinc-500 hover:border-amber-500 transition">Unisex</button>
            </div>
            <div class="w-full md:w-80 relative">
                <input type="text" id="catalogLiveInterfaceSearchField" oninput="window.LoraCatalogViewModule.updateSearchQuery(this.value)" class="w-full bg-white border border-zinc-300 text-zinc-800 px-4 py-2.5 text-xs tracking-wider" placeholder="Search LORA signature collections..." data-i18n-placeholder="searchPlaceholder">
            </div>
        </div>

        <div id="catalogGridDynamicDisplayRoot" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>
    </main>

    <div id="globalLoraSystemNotificationToast" class="luxury-toast-message"></div>

    <script type="module" src="firebase.js"></script>
    <script type="module" src="script.js"></script>
    <script type="module">
        import { LoraProductsEngine } from "./products.js";
        import { LoraApp } from "./script.js";

        const LoraCatalogViewModule = {
            cachedProducts: [],
            filterCategory: "all",
            searchString: "",

            async init() {
                const urlParams = new URLSearchParams(window.location.search);
                const categoryUrlParam = urlParams.get("cat");
                if (categoryUrlParam) this.filterCategory = categoryUrlParam;

                await this.refreshContentList();
            },

            async refreshContentList() {
                if (this.cachedProducts.length === 0) {
                    this.cachedProducts = await LoraProductsEngine.retrieveAllActiveProducts();
                }

                const rootGrid = document.getElementById("catalogGridDynamicDisplayRoot");
                if (!rootGrid) return;

                const processedViewList = this.cachedProducts.filter(item => {
                    const matchCat = this.filterCategory === "all" || item.category === this.filterCategory;
                    const combinedSearchScopeStr = (item.nameEn + item.nameAr + item.descEn + item.descAr).toLowerCase();
                    const matchSearch = combinedSearchScopeStr.includes(this.searchString.toLowerCase());
                    return matchCat && matchSearch;
                });

                if (processedViewList.length === 0) {
                    rootGrid.innerHTML = `<p class="col-span-full text-center text-zinc-400 text-xs py-12 uppercase tracking-widest font-sans">No luxury compositions found matching current tracking parameters filter constraints.</p>`;
                    return;
                }

                rootGrid.innerHTML = processedViewList.map(item => {
                    const primaryNode = item.sizesMatrix && item.sizesMatrix.length > 0 ? item.sizesMatrix[0] : { sizeLabel: 'None', priceValue: 0 };
                    const isWish = LoraApp.state.wishlist.includes(item.id);
                    return `
                        <div class="product-luxury-card flex flex-col justify-between">
                            <div>
                                <div class="relative overflow-hidden bg-white mb-4 border border-zinc-100">
                                    <img src="${item.image}" class="w-full h-80 object-cover transition-transform duration-500 hover:scale-105">
                                    <button onclick="window.LoraCatalogViewModule.toggleWishlistRecord('${item.id}')" class="absolute top-4 right-4 bg-white/90 text-zinc-900 w-8 h-8 rounded-full flex items-center justify-center text-md shadow-sm hover:bg-black hover:text-white transition">
                                        ${isWish ? '♥' : '♡'}
                                    </button>
                                </div>
                                <h3 class="text-lg font-light text-zinc-900 mb-1">${LoraApp.state.lang === 'en' ? item.nameEn : item.nameAr}</h3>
                                <p class="text-xs text-zinc-400 uppercase tracking-widest mb-4">${item.category}</p>
                            </div>
                            <div class="flex justify-between items-center pt-4 border-t border-zinc-100">
                                <span class="text-md font-bold text-zinc-900">$${primaryNode.priceValue}</span>
                                <a href="product.html?id=${item.id}" class="text-xs tracking-widest uppercase bg-zinc-900 text-white px-4 py-2 hover:bg-amber-500 hover:text-black transition">View Compositions</a>
                            </div>
                        </div>
                    `;
                }).join('');
            },

            updateFilterCategory(cat) { this.filterCategory = cat; this.refreshContentList(); },
            updateSearchQuery(queryVal) { this.searchString = queryVal; this.refreshContentList(); },

            toggleWishlistRecord(id) {
                let currentWishlist = LoraApp.state.wishlist;
                if (currentWishlist.includes(id)) {
                    currentWishlist = currentWishlist.filter(item => item !== id);
                    LoraApp.dispatchNotificationToast("removedFromWish");
                } else {
                    currentWishlist.push(id);
                    LoraApp.dispatchNotificationToast("addedToWishlist");
                }
                LoraApp.state.wishlist = currentWishlist;
                localStorage.setItem("lora_brand_wishlist", JSON.stringify(currentWishlist));
                LoraApp.synchronizeBadgeMetrics();
                this.refreshContentList();
            }
        };

        window.LoraCatalogViewModule = LoraCatalogViewModule;
        document.addEventListener("DOMContentLoaded", () => LoraCatalogViewModule.init());
    </script>
</body>
</html>
