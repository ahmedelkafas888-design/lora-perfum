<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Your Vanity Case | LORA PARFUMS</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="global-navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">LORA PARFUMS</a>
            <nav class="nav-links-desktop">
                <a href="index.html" data-i18n="nav_home">Home</a>
                <a href="products.html?category=all" data-i18n="nav_collection">Collection</a>
            </nav>
            <div class="nav-action-utilities">
                <select id="lang-selector-node" class="lang-minimal-dropdown" onchange="executeLanguageToggle(this.value)">
                    <option value="en">EN</option>
                    <option value="ar">AR</option>
                </select>
                <a href="cart.html" class="cart-anchor-icon">
                    🛒<span id="cart-counter-badge" class="cart-counter-pill">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="viewport-wrapper container">
        <h1 class="section-heading-title" data-i18n="cart_title">Your Order Cart</h1>
        
        <div class="cart-split-operational-layout">
            <div id="cart-items-stack-container" class="cart-items-scroll-deck">
                </div>

            <div class="cart-summary-invoice-panel">
                <h3 data-i18n="summary_header">Summary</h3>
                <hr class="divider-line">
                <div class="invoice-row">
                    <span data-i18n="subtotal_label">Subtotal</span>
                    <span id="invoice-subtotal-node">0 EGP</span>
                </div>
                <div class="invoice-row">
                    <span data-i18n="shipping_label">Shipping Matrix</span>
                    <span style="color:var(--luxe-gold); font-weight:600;" data-i18n="complimentary">Complimentary</span>
                </div>
                
                <div class="coupon-operational-form">
                    <label data-i18n="coupon_input_label">Apply Coupon Code</label>
                    <div class="coupon-input-lockup">
                        <input type="text" id="coupon-raw-input-field" placeholder="PROMO20">
                        <button type="button" onclick="validateAndApplyCouponWorkflow()" data-i18n="apply_btn">Apply</button>
                    </div>
                    <small id="coupon-feedback-msg" class="coupon-msg-feedback"></small>
                </div>

                <hr class="divider-line">
                <div class="invoice-row total-highlight-row">
                    <span data-i18n="total_due_label">Total Due</span>
                    <span id="invoice-final-total-node">0 EGP</span>
                </div>

                <button id="cart-checkout-cta" class="action-btn-primary full-width-modifier" onclick="divertToCheckoutWorkflow()" data-i18n="checkout_btn">Proceed to Logistics</button>
            </div>
        </div>
    </main>

    <footer class="global-footer-node">
        <p>&copy; 2026 LORA PARFUMS. <span data-i18n="footer_rights">All Rights Reserved.</span></p>
    </footer>

    <script src="app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            initializeDatabaseEngine();
            // Clear checkout residual active coupons to ensure proper calculations
            localStorage.removeItem("lora_active_applied_coupon");
            syncDocumentLocalization();
            renderCartInterfaceWorkspace();
        });

        function renderCartInterfaceWorkspace() {
            updateNavigationCartTotals();
            const cartItems = fetchCartFromStorage();
            const products = fetchProductsFromStorage();
            const container = document.getElementById("cart-items-stack-container");
            
            if(cartItems.length === 0) {
                container.innerHTML = `<p class="empty-state-text" data-i18n="empty_cart">Your vanity selection card is empty.</p>`;
                document.getElementById("invoice-subtotal-node").innerText = "0 EGP";
                document.getElementById("invoice-final-total-node").innerText = "0 EGP";
                document.getElementById("cart-checkout-cta").disabled = true;
                syncDocumentLocalization();
                return;
            }

            document.getElementById("cart-checkout-cta").disabled = false;
            container.innerHTML = "";
            let runningSubtotalEgp = 0;

            cartItems.forEach((cartItem, arrayIndex) => {
                const targetPerfume = products.find(p => p.id === cartItem.id);
                if(targetPerfume) {
                    const matchedSizeObj = targetPerfume.sizes.find(s => s.volume === cartItem.size) || targetPerfume.sizes[0];
                    const rawBasePrice = parseFloat(matchedSizeObj.priceEgp);
                    const calculatedUnitEgp = rawBasePrice - (rawBasePrice * (parseInt(targetPerfume.discount || 0) / 100));
                    const continuousLineTotal = calculatedUnitEgp * cartItem.quantity;
                    
                    runningSubtotalEgp += continuousLineTotal;

                    const cartItemRow = document.createElement("div");
                    cartItemRow.className = "cart-item-functional-card";
                    cartItemRow.innerHTML = `
                        <img src="${targetPerfume.image}" alt="${targetPerfume.name}">
                        <div class="cart-item-functional-details">
                            <h4>${targetPerfume.name}</h4>
                            <p class="item-size-specifier">${cartItem.size}</p>
                            <span class="item-computed-price">${calculatedUnitEgp.toFixed(0)} EGP</span>
                        </div>
                        <div class="cart-item-functional-actions">
                            <div class="quantity-counter-stepper">
                                <button onclick="modifyCartQuantityWorkflow('${cartItem.id}', '${cartItem.size}', -1)">-</button>
                                <input type="text" value="${cartItem.quantity}" readonly>
                                <button onclick="modifyCartQuantityWorkflow('${cartItem.id}', '${cartItem.size}', 1)">+</button>
                            </div>
                            <button class="item-removal-trigger" onclick="removeLineItemFromCartWorkflow('${cartItem.id}', '${cartItem.size}')" data-i18n="remove_item">Remove</button>
                        </div>
                    `;
                    container.appendChild(cartItemRow);
                }
            });

            document.getElementById("invoice-subtotal-node").innerText = `${runningSubtotalEgp.toFixed(0)} EGP`;
            
            // Coupon application
            const activeCoupon = JSON.parse(localStorage.getItem("lora_active_applied_coupon"));
            let absoluteCalculatedNet = runningSubtotalEgp;
            const feedbackMsgNode = document.getElementById("coupon-feedback-msg");

            if(activeCoupon) {
                const deduction = runningSubtotalEgp * (parseInt(activeCoupon.percentage) / 100);
                absoluteCalculatedNet = runningSubtotalEgp - deduction;
                feedbackMsgNode.innerText = `${getSystemLocaleMap()[getCurrentSystemLanguage()]["coupon_valid_prefix"]} -${activeCoupon.percentage}%`;
                feedbackMsgNode.className = "coupon-msg-feedback success";
            }

            document.getElementById("invoice-final-total-node").innerText = `${absoluteCalculatedNet.toFixed(0)} EGP`;
            syncDocumentLocalization();
        }

        function modifyCartQuantityWorkflow(id, size, delta) {
            adjustCartItemQuantity(id, size, delta);
            renderCartInterfaceWorkspace();
        }

        function removeLineItemFromCartWorkflow(id, size) {
            purgeCartItemLine(id, size);
            renderCartInterfaceWorkspace();
        }

        function validateAndApplyCouponWorkflow() {
            const rawCode = document.getElementById("coupon-raw-input-field").value.trim().toUpperCase();
            const couponRegistry = JSON.parse(localStorage.getItem("lora_coupons")) || [];
            const feedbackMsgNode = document.getElementById("coupon-feedback-msg");

            const activeFoundCoupon = couponRegistry.find(c => c.code.toUpperCase() === rawCode && c.enabled);
            
            if(activeFoundCoupon) {
                localStorage.setItem("lora_active_applied_coupon", JSON.stringify(activeFoundCoupon));
            } else {
                localStorage.removeItem("lora_active_applied_coupon");
                feedbackMsgNode.innerText = getSystemLocaleMap()[getCurrentSystemLanguage()]["coupon_invalid"];
                feedbackMsgNode.className = "coupon-msg-feedback error";
            }
            renderCartInterfaceWorkspace();
        }

        function divertToCheckoutWorkflow() {
            window.location.href = "checkout.html";
        }
    </script>
</body>
</html>
