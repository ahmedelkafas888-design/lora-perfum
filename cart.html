<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Vanity Case | LORA</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <div id="toast-container" class="toast-container"></div>

    <header>
        <div class="nav-container">
            <div class="lang-switch-wrapper">
                <button onclick="toggleLanguageSystem()" class="lang-toggle-btn" id="lang-btn">العربية</button>
            </div>
            <a href="index.html" class="logo">LORA</a>
            <div class="nav-icons">
                <a href="admin.html" class="nav-admin-icon">⚙️</a>
                <a href="cart.html" class="cart-icon-wrapper active">
                    🛒 <span id="cart-badge" class="cart-badge">0</span>
                </a>
            </div>
        </div>
        <nav class="sub-nav-menu">
            <a href="index.html" data-i18n="nav_home">Home</a>
            <a href="products.html?category=all" data-i18n="nav_collection">Collection</a>
        </nav>
    </header>

    <section class="container">
        <h1 class="section-title" data-i18n="cart_title">Your Order Cart</h1>
        <div class="cart-layout">
            <div id="cart-items-list" class="cart-items"></div>
            <div class="cart-summary-box">
                <h3 data-i18n="summary_header">Summary</h3>
                <hr>
                <div class="summary-row">
                    <span data-i18n="subtotal_label">Subtotal</span>
                    <span id="cart-subtotal-egp">0 EGP</span>
                </div>
                <div class="summary-row">
                    <span data-i18n="shipping_label">Shipping</span>
                    <span style="color:var(--luxury-gold);" data-i18n="shipping_value">Complimentary</span>
                </div>
                
                <div class="form-group" style="margin-top: 1.5rem; margin-bottom: 0.5rem;">
                    <label data-i18n="coupon_field_lbl">Apply Coupon Code</label>
                    <div style="display:flex; gap:0.5rem;">
                        <input type="text" id="coupon-input" placeholder="Enter Code" style="padding:0.5rem;">
                        <button class="btn" style="padding:0.5rem 1rem; font-size:0.7rem;" onclick="applyPromoCoupon()" data-i18n="btn_apply">Apply</button>
                    </div>
                    <small id="coupon-msg" style="margin-top:6px; display:block; font-weight:600;"></small>
                </div>
                <hr>
                <div class="summary-row total-row">
                    <span data-i18n="total_due_lbl">Total Due</span>
                    <span id="cart-total-egp">0 EGP</span>
                </div>
                <a href="checkout.html" class="btn checkout-btn" id="checkout-link-btn" data-i18n="btn_proceed">Proceed to Logistics</a>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 LORA. <span data-i18n="footer_rights">All Rights Reserved.</span></p>
    </footer>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initApp();
            applyLanguageDOM();
            localStorage.removeItem('lora_applied_coupon');
            renderCartPage();
        });

        function renderCartPage() {
            updateCartBadge();
            const cart = getCart();
            const products = getProducts();
            const container = document.getElementById('cart-items-list');
            const checkoutBtn = document.getElementById('checkout-link-btn');
            
            if (cart.length === 0) {
                container.innerHTML = `<p style="padding: 2rem 0; font-style: italic; color:#777;" data-i18n="cart_empty">Your selection is currently empty.</p>`;
                document.getElementById('cart-subtotal-egp').innerText = '0 EGP';
                document.getElementById('cart-total-egp').innerText = '0 EGP';
                checkoutBtn.style.pointerEvents = 'none';
                checkoutBtn.style.opacity = '0.4';
                applyLanguageDOM();
                return;
            }

            checkoutBtn.style.pointerEvents = 'auto';
            checkoutBtn.style.opacity = '1';
            container.innerHTML = '';
            let subtotalEGP = 0;

            cart.forEach(item => {
                const product = products.find(p => p.id === item.id);
                if (product) {
                    const linePriceEGP = calculateFinalPrice(product.price, product.discount);
                    const itemTotalEGP = linePriceEGP * item.quantity;
                    subtotalEGP += itemTotalEGP;
                    
                    container.innerHTML += `
                        <div class="cart-item-card">
                            <img src="${product.image}" alt="${product.name}">
                            <div class="cart-item-details">
                                <h4>${product.name}</h4>
                                <p style="font-size:0.75rem; margin:2px 0; color:#666;">Size: ${product.bottleSize || '100ML'} | Line: ${product.category}</p>
                                <span class="cart-item-price">${linePriceEGP.toFixed(0)} EGP</span>
                            </div>
                            <div class="cart-item-actions">
                                <div class="qty-selector">
                                    <button onclick="changeQty('${product.id}', -1)">-</button>
                                    <input type="text" value="${item.quantity}" readonly>
                                    <button onclick="changeQty('${product.id}', 1)">+</button>
                                </div>
                                <button class="delete-item-btn" onclick="deleteFromCart('${product.id}')" data-i18n="btn_remove">Remove</button>
                            </div>
                        </div>
                    `;
                }
            });

            document.getElementById('cart-subtotal-egp').innerText = `${subtotalEGP.toFixed(0)} EGP`;
            
            const activeCoupon = JSON.parse(localStorage.getItem('lora_applied_coupon'));
            let finalTotal = subtotalEGP;
            if (activeCoupon) {
                const deduction = (subtotalEGP * (parseInt(activeCoupon.percentage) / 100));
                finalTotal = subtotalEGP - deduction;
                document.getElementById('coupon-msg').innerText = `Coupon Applied: -${activeCoupon.percentage}%`;
                document.getElementById('coupon-msg').style.color = '#27ae60';
            }
            
            document.getElementById('cart-total-egp').innerText = `${finalTotal.toFixed(0)} EGP`;
            applyLanguageDOM();
        }

        function changeQty(id, delta) {
            updateCartItemQty(id, delta);
            renderCartPage();
        }

        function deleteFromCart(id) {
            removeFromCart(id);
            renderCartPage();
        }

        function applyPromoCoupon() {
            const input = document.getElementById('coupon-input').value.trim().toUpperCase();
            const coupons = JSON.parse(localStorage.getItem('lora_coupons')) || [];
            const msg = document.getElementById('coupon-msg');
            const isAr = getCurrentLang() === 'ar';
            
            const match = coupons.find(c => c.code.toUpperCase() === input && c.active);
            if (match) {
                localStorage.setItem('lora_applied_coupon', JSON.stringify(match));
                msg.innerText = isAr ? `تم تفعيل الكوبون: خصم ${match.percentage}%` : `Validated: ${match.percentage}% Markdown applied.`;
                msg.style.color = "#27ae60";
                showToastNotification(isAr ? "✓ تم تطبيق الكوبون بنجاح" : "✓ Coupon applied successfully");
                renderCartPage();
            } else {
                localStorage.removeItem('lora_applied_coupon');
                msg.innerText = isAr ? "كود الخصم غير صلاح أو منتهي" : "Invalid or inactive coupon code.";
                msg.style.color = "#c0392b";
                renderCartPage();
            }
        }
    </script>
</body>
</html>
