<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - LORA</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">LORA</a>
            <div class="nav-icons">
                <button class="lang-btn" id="langToggle">العربية</button>
            </div>
        </div>
    </nav>

    <header class="luxury-hero">
        <h1 data-i18n="cart_hero_title">Your Shopping Cart</h1>
        <p data-i18n="cart_hero_subtitle">Luxury Awaits Your Final Confirmation</p>
    </header>

    <main class="container">
        <div class="workspace-split">
            <div class="items-panel" id="cartRowsContainer">
                </div>

            <div class="summary-panel">
                <h3 class="summary-title" data-i18n="summary_title">Order Summary</h3>
                
                <div class="promo-box">
                    <label class="promo-label" data-i18n="coupon_label">Have a promo code?</label>
                    <div class="promo-row">
                        <input type="text" id="couponField" class="promo-input" placeholder="CODE">
                        <button id="applyCouponBtn" class="promo-btn" data-i18n="coupon_apply">Apply</button>
                    </div>
                    <div id="couponFeedback" class="feedback-msg"></div>
                </div>

                <div class="summary-row">
                    <span data-i18n="subtotal_label">Subtotal</span>
                    <span><span id="subtotalValue">0.00</span> EGP</span>
                </div>
                <div class="summary-row discount">
                    <span data-i18n="discount_label">Discount</span>
                    <span>-<span id="discountValue">0.00</span> EGP</span>
                </div>
                <div class="summary-row total">
                    <span data-i18n="total_label">Final Total</span>
                    <span><span id="totalValue">0.00</span> EGP</span>
                </div>

                <button class="btn-checkout-action" id="goToCheckoutBtn" data-i18n="checkout_btn">Proceed To Checkout</button>
            </div>
        </div>
    </main>

    <script type="module" src="cart.js"></script>
</body>
</html>
