<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Trunk Selection | Maison De Parfum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="store-container nav-wrapper">
            <button id="langSwitcherBtn" class="text-xs tracking-widest uppercase font-bold text-amber-500">العربية</button>
            <a href="index.html" class="text-2xl tracking-[0.2em] font-light luxury-heading gold-gradient-text">MAISON DE PARFUM</a>
            <nav class="hidden md:flex gap-8">
                <ul class="nav-links">
                    <li><a href="index.html" data-i18n="navHome">Home</a></li>
                    <li><a href="products.html" data-i18n="navProducts">Fragrances</a></li>
                    <li><a href="wishlist.html" data-i18n="navWishlist">Wishlist</a></li>
                    <li><a href="admin.html" data-i18n="navAdmin">Atelier Panel</a></li>
                </ul>
            </nav>
            <div class="nav-icons">
                <a href="wishlist.html" class="icon-btn"><span>♥</span><span id="wishlistCountBadge" class="badge">0</span></a>
                <a href="cart.html" class="icon-btn"><span>🛒</span><span id="cartCountBadge" class="badge">0</span></a>
            </div>
        </div>
    </header>

    <main class="pt-[140px] store-container pb-24">
        <h1 class="text-3xl font-light tracking-widest text-center mb-12 uppercase gold-gradient-text" data-i18n="viewCart">Review Collection</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">
            <div id="cartPageListInjectContainer" class="lg:col-span-8 space-y-4">
                </div>
            
            <div class="lg:col-span-4 bg-[#121212] border border-zinc-800 p-6 md:p-8 space-y-6">
                <h3 class="text-lg font-light tracking-wide uppercase border-b border-zinc-800 pb-3" data-i18n="totalLabel">Aggregated Valuation</h3>
                <div class="flex justify-between items-center text-xl font-light">
                    <span class="text-zinc-400">Total Sum:</span>
                    <span id="cartPageDynamicValuationSum" class="text-amber-400 font-bold">$0</span>
                </div>
                <a href="checkout.html" class="premium-btn block text-center w-full bg-amber-500 text-black font-bold">Proceed to Verification</a>
            </div>
        </div>
    </main>

    <script type="module" src="firebase.js"></script>
    <script type="module" src="script.js"></script>
    <script type="module">
        import { dbEngine } from "./firebase.js";
        import { StoreApp } from "./script.js";
        import { CartEngine } from "./cart.js";

        async function renderCartPage() {
            const container = document.getElementById("cartPageListInjectContainer");
            const totalDisplay = document.getElementById("cartPageDynamicValuationSum");
            if (!container) return;

            const cart = StoreApp.state.cart;
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-zinc-500 text-center py-12">Your collection trunk is empty.</p>`;
                totalDisplay.innerText = "$0";
                return;
            }

            let computedTotal = 0;
            let rowsHtml = "";

            for (const cartItem of cart) {
                const prod = await dbEngine.getDocument("products", cartItem.id);
                if (prod) {
                    const lineCost = prod.price * cartItem.qty;
                    computedTotal += lineCost;
                    rowsHtml += `
                        <div class="bg-[#121212] border border-zinc-800 p-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div class="flex items-center gap-4 w-full sm:w-auto">
                                <img src="${prod.image}" class="w-16 h-16 object-cover border border-zinc-700">
                                <div>
                                    <h4 class="text-white font-medium">${StoreApp.state.lang === 'en' ? prod.nameEn : prod.nameAr}</h4>
                                    <p class="text-xs text-amber-500">$${prod.price}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-6 justify-between w-full sm:w-auto">
                                <input type="number" value="${cartItem.qty}" min="1" onchange="window.CartEngine.updateQuantity('${prod.id}', this.value)" class="w-16 luxury-input text-center py-1">
                                <span class="text-sm text-white font-mono">$${lineCost}</span>
                                <button type="button" onclick="window.CartEngine.removeFromCart('${prod.id}')" class="text-red-400 hover:text-red-600 text-sm">✕</button>
                            </div>
                        </div>
                    `;
                } else {
                    // Instantly drop unresolvable entity links from locally cached state matrices
                    window.CartEngine.removeFromCart(cartItem.id);
                }
            }

            container.innerHTML = rowsHtml;
            totalDisplay.innerText = `$${computedTotal}`;
        }

        window.CartEngine.renderCartPage = renderCartPage;
        document.addEventListener("DOMContentLoaded", () => renderCartPage());
    </script>
</body>
</html>
