<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Bag Selection | LORA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <button id="langSwitcherBtn" class="text-xs tracking-widest uppercase font-bold text-amber-500">العربية</button>
            <a href="index.html" class="brand-logo">LORA</a>
            <nav class="hidden md:flex">
                <ul class="nav-links">
                    <li><a href="index.html" data-i18n="navHome">Home</a></li>
                    <li><a href="products.html" data-i18n="navProducts">Fragrances</a></li>
                    <li><a href="wishlist.html" data-i18n="navWishlist">Wishlist</a></li>
                    <li><a href="admin.html" data-i18n="navAdmin">Atelier Vault</a></li>
                </ul>
            </nav>
            <div class="nav-actions">
                <a href="wishlist.html" class="icon-btn text-xl relative">♥<span id="wishlistCountBadge" class="badge">0</span></a>
                <a href="cart.html" class="icon-btn text-xl relative">🛒<span id="cartCountBadge" class="badge">0</span></a>
            </div>
        </div>
    </header>

    <main class="pt-[140px] max-w-7xl mx-auto px-8 pb-24">
        <h1 class="text-2xl tracking-widest uppercase text-center mb-12 text-zinc-900">Your Shopping Trunk</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
            <div id="cartViewRowsOutputWrapperDOMNode" class="lg:col-span-8 space-y-4">
                </div>
            
            <div class="lg:col-span-4 bg-[#faf9f6] border border-zinc-200 p-8 space-y-6">
                <h3 class="text-sm tracking-widest uppercase text-zinc-800 border-b border-zinc-200 pb-3" data-i18n="totalVal">Aggregated Valuation Total</h3>
                <div class="flex justify-between items-center text-xl font-bold text-zinc-900">
                    <span>Summary Total:</span>
                    <span id="cartSummaryAggregatedNumericTotalDisplay">$0.00</span>
                </div>
                <a href="checkout.html" class="premium-btn w-full block text-center text-xs tracking-widest" data-i18n="checkoutBtn">Complete Verification Purchase</a>
            </div>
        </div>
    </main>

    <div id="globalLoraSystemNotificationToast" class="luxury-toast-message"></div>

    <script type="module" src="firebase.js"></script>
    <script type="module" src="script.js"></script>
    <script type="module" src="cart.js"></script>
    <script type="module">
        import { LoraProductsEngine } from "./products.js";
        import { LoraApp } from "./script.js";
        import { LoraCartController } from "./cart.js";

        async function reHydrateCartDisplayDOMView() {
            const containerNode = document.getElementById("cartViewRowsOutputWrapperDOMNode");
            const numericTotalDisplay = document.getElementById("cartSummaryAggregatedNumericTotalDisplay");
            if (!containerNode) return;

            const trackingCartItemsList = LoraApp.state.cart;
            if (trackingCartItemsList.length === 0) {
                containerNode.innerHTML = `<p class="text-zinc-400 font-sans text-xs py-12 text-center uppercase tracking-wider">Your active bag selection trunk is empty.</p>`;
                if (numericTotalDisplay) numericTotalDisplay.innerText = "$0.00";
                return;
            }

            let runningTotalComputedSum = 0;
            let dynamicInjectedAccumulatedRowsHtml = "";

            for (const activeRowItem of trackingCartItemsList) {
                const targetProductMapRef = await LoraProductsEngine.retrieveSingleProduct(activeRowItem.id);
                if (targetProductMapRef) {
                    const rowLineValuationTotal = activeRowItem.price * activeRowItem.qty;
                    runningTotalComputedSum += rowLineValuationTotal;
                    dynamicInjectedAccumulatedRowsHtml += `
                        <div class="bg-white border border-zinc-200 p-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div class="flex items-center gap-4 w-full sm:w-auto">
                                <img src="${targetProductMapRef.image}" class="w-16 h-16 object-cover border border-zinc-100">
                                <div>
                                    <h4 class="text-sm font-medium text-zinc-900">${LoraApp.state.lang === 'en' ? targetProductMapRef.nameEn : targetProductMapRef.nameAr}</h4>
                                    <p class="text-xs text-amber-600 font-mono">${activeRowItem.selectedSize} @ $${activeRowItem.price}</p>
                                </div>
                            </div>
                            <div class="flex items-center justify-between sm:justify-end gap-6 w-full sm:w-auto">
                                <input type="number" min="1" value="${activeRowItem.qty}" onchange="window.LoraCartController.modifyItemQuantity('${activeRowItem.id}', '${activeRowItem.selectedSize}', this.value)" class="w-16 bg-zinc-50 border border-zinc-300 text-center text-xs py-1">
                                <span class="text-sm font-bold text-zinc-900 font-mono">$${rowLineValuationTotal}</span>
                                <button onclick="window.LoraCartController.removeItemFromCart('${activeRowItem.id}', '${activeRowItem.selectedSize}')" class="text-zinc-300 hover:text-red-600 text-sm font-sans">✕</button>
                            </div>
                        </div>
                    `;
                }
            }

            containerNode.innerHTML = dynamicInjectedAccumulatedRowsHtml;
            if (numericTotalDisplay) numericTotalDisplay.innerText = `$${runningTotalComputedSum}`;
        }

        window.reHydrateCartDisplayDOMView = reHydrateCartDisplayDOMView;
        document.addEventListener("DOMContentLoaded", () => reHydrateCartDisplayDOMView());
    </script>
</body>
</html>
