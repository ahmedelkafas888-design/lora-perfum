<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Panel</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: #ffffff;
            color: #111;
            font-family: system-ui;
        }

        .lux-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #e5e5e5;
            outline: none;
        }

        .lux-input:focus {
            border-color: #d4af37;
        }
    </style>
</head>

<body>

<!-- 🔐 LOGIN OVERLAY -->
<div id="adminLogin" class="fixed inset-0 flex items-center justify-center bg-white/95 backdrop-blur-xl z-50">

    <div class="w-[90%] max-w-md bg-white border border-amber-200 shadow-2xl p-8 space-y-6 rounded-2xl relative overflow-hidden">

        <!-- Glow -->
        <div class="absolute -top-20 -left-20 w-40 h-40 bg-amber-200/30 blur-3xl rounded-full"></div>
        <div class="absolute -bottom-20 -right-20 w-40 h-40 bg-amber-300/20 blur-3xl rounded-full"></div>

        <!-- Title -->
        <div class="text-center space-y-2">
            <h1 class="text-2xl uppercase tracking-widest text-amber-500">
                Admin Portal
            </h1>
            <p class="text-xs text-gray-500">
                Secure Authentication Required
            </p>
        </div>

        <!-- Input -->
        <div>
            <input id="adminEmailInput" type="email" placeholder="Enter admin email"
                   class="lux-input rounded-md">
        </div>

        <!-- Button -->
        <button onclick="checkAdminLogin()"
                class="w-full py-3 bg-amber-400 hover:bg-amber-300 text-black uppercase tracking-widest rounded-md">
            Unlock Dashboard
        </button>

        <!-- Error -->
        <p id="loginError" class="text-red-500 text-xs text-center hidden">
            Access Denied
        </p>

        <p class="text-[10px] text-gray-400 text-center">
            Protected Admin System
        </p>

    </div>
</div>

<!-- 📊 ADMIN DASHBOARD -->
<header class="p-6 border-b flex justify-between">
    <h1 class="text-xl font-bold text-amber-500">Admin Dashboard</h1>
    <a href="index.html">Back to Store</a>
</header>

<main class="p-6 grid gap-4">

    <h2 class="text-lg font-semibold">Products Control</h2>

    <form id="adminProductForm" class="grid gap-2">
        <input id="prodId" type="hidden">

        <input id="prodNameEn" placeholder="Product Name EN" class="lux-input">
        <input id="prodNameAr" placeholder="Product Name AR" class="lux-input">
        <input id="prodCategory" placeholder="Category" class="lux-input">
        <input id="prodPrice" placeholder="Price" class="lux-input">
        <input id="prodStock" placeholder="Stock" class="lux-input">
        <input id="prodImage" placeholder="Image URL" class="lux-input">
        <textarea id="prodDescEn" placeholder="Description EN" class="lux-input"></textarea>
        <textarea id="prodDescAr" placeholder="Description AR" class="lux-input"></textarea>

        <button class="bg-black text-white py-2">Save Product</button>
    </form>

    <div id="adminProductsGridContainer" class="grid gap-2 mt-6"></div>

    <h2 class="text-lg font-semibold mt-10">Orders</h2>
    <div id="adminOrdersGridContainer"></div>

</main>

<script type="module" src="admin.js"></script>

<script>
const ADMIN_EMAIL = "ahmedelkafas888@gmail.com";

window.checkAdminLogin = function () {
    const email = document.getElementById("adminEmailInput").value;

    if (email === ADMIN_EMAIL) {
        document.getElementById("adminLogin").style.display = "none";
        localStorage.setItem("adminLoggedIn", "true");
    } else {
        document.getElementById("loginError").classList.remove("hidden");
    }
};

document.addEventListener("DOMContentLoaded", () => {
    const logged = localStorage.getItem("adminLoggedIn");

    if (!logged) {
        document.getElementById("adminLogin").style.display = "flex";
    } else {
        document.getElementById("adminLogin").style.display = "none";
    }
});
</script>

</body>
</html>
