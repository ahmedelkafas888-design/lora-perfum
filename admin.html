<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Atelier Console Room | LORA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #080808; color: #f0f0f0; font-family: 'Marcellus', serif; }
        body[dir="rtl"] { font-family: 'Tajawal', sans-serif; }
        .lux-input-dark { background-color: #121212; border: 1px solid #262626; color: #ffffff; padding: 0.75rem 1rem; width: 100%; transition: all 0.3s; }
        .lux-input-dark:focus { outline: none; border-color: #d4af37; background-color: #161616; }
        .tab-btn-active { border-color: #d4af37; color: #d4af37; background: rgba(212,175,55,0.05); }
    </style>
</head>
<body class="antialiased min-h-screen pb-24">

    <div id="adminAuthAccessGateModalWindow" class="fixed inset-0 bg-neutral-950 z-[9999] flex items-center justify-center p-4">
        <div class="bg-[#111111] border border-neutral-800 p-6 sm:p-10 max-w-md w-full text-center space-y-6">
            <div class="space-y-1">
                <h2 class="text-3xl tracking-[0.2em] font-light text-white">LORA ATELIER</h2>
                <p class="text-[10px] tracking-widest text-amber-500 uppercase font-sans">Secure Authorization Portal Matrix</p>
            </div>
            <div>
                <input type="password" id="adminSecurityAccessKeyField" class="lux-input-dark text-center font-mono tracking-widest text-sm" placeholder="ACCESS CODE KEY">
            </div>
            <button type="button" id="adminSubmitAuthAccessGateBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-neutral-950 text-xs tracking-widest uppercase font-bold py-3.5 transition duration-300">Unlock Workspace</button>
        </div>
    </div>

    <header class="border-b border-neutral-900 bg-neutral-950/50 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="space-y-0.5">
                <h1 class="text-xl tracking-[0.2em] text-white">LORA CONSOLE</h1>
                <p class="text-[9px] text-amber-500 tracking-widest uppercase font-sans">Production Vault Datastore v3.0</p>
            </div>
            <div class="flex items-center gap-4">
                <button id="adminLangToggleBtn" class="text-xs font-sans tracking-widest uppercase text-amber-500 font-bold border border-amber-500/20 px-3 py-1 bg-amber-500/5 hover:bg-amber-500 hover:text-black transition duration-300">Switch View Language</button>
                <a href="index.html" class="text-xs font-sans tracking-widest uppercase text-neutral-400 hover:text-white transition">Exit Terminal</a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-10">
        <div class="flex border-b border-neutral-800 gap-2 mb-8 font-sans text-xs uppercase tracking-wider">
            <button id="tabBtn-products" class="tab-btn-active border-b-2 border-transparent px-6 py-3 font-medium text-neutral-400 hover:text-white transition">Fragrances</button>
            <button id="tabBtn-coupons" class="border-b-2 border-transparent px-6 py-3 font-medium text-neutral-400 hover:text-white transition">Coupons</button>
            <button id="tabBtn-settings" class="border-b-2 border-transparent px-6 py-3 font-medium text-neutral-400 hover:text-white transition">Settings</button>
        </div>

        <section id="adminTabSection-products" class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            <div class="lg:col-span-5 bg-[#0e0e0e] border border-neutral-800 p-6 space-y-4 font-sans text-xs">
                <h3 class="text-sm font-serif font-light text-amber-500 tracking-widest uppercase border-b border-neutral-800 pb-2">Fragrance Profiling Form</h3>
                <form id="adminProductFormElement" class="space-y-4">
                    <input type="hidden" id="editProductHiddenIdField">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-neutral-400 mb-1">Title (EN)</label>
                            <input type="text" id="pNameEn" required class="lux-input-dark font-serif text-sm">
                        </div>
                        <div>
                            <label class="block text-neutral-400 mb-1">الاسم (AR)</label>
                            <input type="text" id="pNameAr" required dir="rtl" class="lux-input-dark text-sm">
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-4">
                        <div>
                            <label class="block text-neutral-400 mb-1">Category</label>
                            <select id="pCategory" class="lux-input-dark text-xs">
                                <option value="men">Men</option>
                                <option value="women">Women</option>
                                <option value="unisex">Unisex</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-neutral-400 mb-1">Bottle Vol (ml)</label>
                            <input type="number" id="pSize" required class="lux-input-dark font-mono text-sm" placeholder="100">
                        </div>
                        <div>
                            <label class="block text-neutral-400 mb-1">Stock Level</label>
                            <input type="number" id="pStock" required class="lux-input-dark font-mono text-sm" placeholder="10">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-neutral-400 mb-1">Base Price (EGP)</label>
                            <input type="number" id="pPrice" required class="lux-input-dark font-mono text-sm">
                        </div>
                        <div>
                            <label class="block text-neutral-400 mb-1">Discount Price (EGP)</label>
                            <input type="number" id="pDiscountPrice" class="lux-input-dark font-mono text-sm" placeholder="Optional">
                        </div>
                    </div>
                    <div>
                        <label class="block text-neutral-400 mb-1">Direct Media File Upload</label>
                        <input type="file" id="pProductImageFileInput" accept="image/*" class="w-full text-xs text-neutral-400 file:mr-4 file:py-2 file:px-4 file:border-0 file:bg-neutral-800 file:text-white hover:file:bg-neutral-700 transition cursor-pointer">
                        <div id="imageUploadProgressTrackerFeedback" class="text-[11px] text-amber-500 mt-1 hidden"></div>
                        <input type="hidden" id="pUploadedImageSecureURLString">
                    </div>
                    <div>
                        <label class="block text-neutral-400 mb-1">Description Narrative (EN)</label>
                        <textarea id="pDescEn" rows="3" class="lux-input-dark text-xs"></textarea>
                    </div>
                    <div>
                        <label class="block text-neutral-400 mb-1">الوصف العطري (AR)</label>
                        <textarea id="pDescAr" rows="3" dir="rtl" class="lux-input-dark text-xs"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-neutral-950 font-bold uppercase tracking-widest text-xs py-3 transition">Commit System Ledger Mapping</button>
                </form>
            </div>

            <div class="lg:col-span-7 bg-[#0e0e0e] border border-neutral-800 p-6 space-y-4">
                <h3 class="text-sm tracking-widest text-amber-500 uppercase border-b border-neutral-800 pb-2 font-sans font-medium">Active Fragrances Ledger Matrix</h3>
                <div id="adminLiveCatalogLedgerInjectedWrapper" class="space-y-2 max-h-[650px] overflow-y-auto pr-2"></div>
            </div>
        </section>

        <section id="adminTabSection-coupons" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
            <div class="lg:col-span-5 bg-[#0e0e0e] border border-neutral-800 p-6 space-y-4 font-sans text-xs">
                <h3 class="text-sm font-serif font-light text-amber-500 tracking-widest uppercase border-b border-neutral-800 pb-2">Create Discount Coupon</h3>
                <form id="adminCouponCreationFormElement" class="space-y-4">
                    <div>
                        <label class="block text-neutral-400 mb-1">Coupon Code Token</label>
                        <input type="text" id="cCode" required class="lux-input-dark uppercase tracking-widest text-sm font-mono" placeholder="AHMED30">
                    </div>
                    <div>
                        <label class="block text-neutral-400 mb-1">Discount Percentage (%)</label>
                        <input type="number" id="cPercentage" required class="lux-input-dark text-sm font-mono" placeholder="30">
                    </div>
                    <div>
                        <label class="block text-neutral-400 mb-1">Operational State Status</label>
                        <select id="cEnabled" class="lux-input-dark text-xs">
                            <option value="true">Active & Enabled</option>
                            <option value="false">Disabled & Suspended</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-neutral-950 font-bold uppercase tracking-widest text-xs py-3 transition">Publish Coupon Token</button>
                </form>
            </div>
            
            <div class="lg:col-span-7 bg-[#0e0e0e] border border-neutral-800 p-6 space-y-4">
                <h3 class="text-sm tracking-widest text-amber-500 uppercase border-b border-neutral-800 pb-2 font-sans font-medium">Active Promo Tokens Matrix</h3>
                <div id="adminLiveCouponsLedgerInjectedWrapper" class="space-y-2"></div>
            </div>
        </section>

        <section id="adminTabSection-settings" class="hidden bg-[#0e0e0e] border border-neutral-800 p-6 max-w-2xl mx-auto font-sans text-xs space-y-6">
            <div>
                <h3 class="text-sm font-serif font-light text-amber-500 tracking-widest uppercase border-b border-neutral-800 pb-2 mb-4">Ecosystem Global Preferences Matrix</h3>
                <form id="adminGlobalSettingsFormElement" class="space-y-4">
                    <div>
                        <label class="block text-neutral-400 mb-1">Primary Routing Channel Line Address (WhatsApp Number)</label>
                        <input type="text" id="cfgWhatsAppLine" required class="lux-input-dark text-amber-400 tracking-widest font-mono text-sm">
                    </div>
                    <button type="submit" class="bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 text-white text-xs tracking-widest uppercase px-6 py-2.5 transition">Save Preference Mapping</button>
                </form>
            </div>
        </section>
    </main>

    <div class="toast-container" id="toastContainerStack"></div>

    <script type="module" src="firebase.js"></script>
    <script type="module" src="script.js"></script>
    <script type="module" src="admin.js"></script>
</body>
</html>
